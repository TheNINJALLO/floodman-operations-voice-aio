[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floodman-operations-voice-aio"
version = "1.1.1"
description = "Self-hosted Floodman AI phone operations controller for Asterisk and AVA"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "TheN1NJ4LL0"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "python-multipart>=0.0.9,<1",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
local-stt = ["faster-whisper>=1.1,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1"]

[project.scripts]
floodman-voice = "app.main:run"
floodman-agent-bootstrap = "app.ava.bootstrap:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
