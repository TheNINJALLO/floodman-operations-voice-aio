[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floodman-voice-appliance"
version = "0.1.0"
description = "Single-unit, self-hosted Floodman telephone receptionist"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "PyYAML>=6,<7",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "soundfile>=0.13,<1",
  "faster-whisper>=1.1,<2",
  "kokoro-onnx>=0.4,<1",
  "onnxruntime>=1.20,<2",
  "huggingface-hub>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["app"]
