# TEMPLATE ONLY
#
# The installer publishes the first image directly. GitHub rejects root
# workflow-file changes pushed by a GitHub App token without the separate
# Workflows permission. Copy this file manually to:
#   .github/workflows/ci-gpu-appliance.yml
# only with a credential allowed to manage workflow files.

name: Build Floodman GPU Appliance

"on":
  push:
    branches:
      - self-hosted-gpu-appliance
      - main
    paths:
      - appliance/**
      - .github/workflows/ci-gpu-appliance.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: floodman-gpu-appliance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test appliance source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appliance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: appliance/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m compileall app scripts tests
      - run: bash -n scripts/*.sh

  container:
    name: Build RTX A1000 appliance image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and publish GPU appliance
        uses: docker/build-push-action@v6
        with:
          context: ./appliance
          file: ./appliance/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:gpu-appliance
            ${{ env.IMAGE }}:gpu-appliance-${{ github.sha }}
          cache-from: type=gha,scope=gpu-appliance
          cache-to: type=gha,mode=max,scope=gpu-appliance
      - uses: actions/upload-artifact@v4
        with:
          name: floodman-gpu-appliance-pterodactyl-egg
          path: appliance/pterodactyl/egg-floodman-voice-appliance.json
