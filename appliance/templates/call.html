{% extends "base.html" %}{% block content %}<h1>Call {{ call.call_uuid }}</h1><div class="grid"><section class="card"><h2>Intake</h2><pre>{{ call.snapshot | tojson(indent=2) }}</pre></section><section class="card"><h2>Conversation</h2>{% for item in call.messages %}<div class="message {{ item.role }}"><strong>{{ item.role }}</strong><p>{{ item.text }}</p></div>{% endfor %}</section></div><section class="card"><h2>Notifications</h2><pre>{{ call.notifications | tojson(indent=2) }}</pre></section>{% endblock %}
