worker_processes auto;
pid /home/container/data/business/run/gateway-nginx.pid;
error_log /home/container/data/business/logs/gateway-nginx-error.log warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    client_body_temp_path /home/container/data/business/tmp/gateway-client;
    proxy_temp_path /home/container/data/business/tmp/gateway-proxy;
    fastcgi_temp_path /home/container/data/business/tmp/gateway-fastcgi;
    uwsgi_temp_path /home/container/data/business/tmp/gateway-uwsgi;
    scgi_temp_path /home/container/data/business/tmp/gateway-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $fm_forwarded_scheme {
        default $scheme;
        ~*^https$ https;
        ~*^http$ http;
    }

    server {
        listen 0.0.0.0:8002 default_server;
        server_name aicall.oninetwork.com localhost 127.0.0.1;
        location / {
            proxy_pass http://127.0.0.1:8802;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fm_forwarded_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
    }

    server {
        listen 0.0.0.0:8002;
        server_name floodman.oninetwork.com;
        location / {
            proxy_pass http://127.0.0.1:9000;
            include /opt/floodman/unified/proxy-headers.conf;
        }
    }

    server {
        listen 0.0.0.0:8002;
        server_name sign.oninetwork.com;
        location / {
            proxy_pass http://127.0.0.1:9001;
            include /opt/floodman/unified/proxy-headers.conf;
        }
    }

    server {
        listen 0.0.0.0:8002;
        server_name lab.oninetwork.com;
        location / {
            proxy_pass http://127.0.0.1:9003;
            include /opt/floodman/unified/proxy-headers.conf;
        }
    }

    server {
        listen 0.0.0.0:8002;
        server_name api.oninetwork.com;

        location = /mobile-api {
            return 308 /mobile-api/;
        }

        # The native/mobile contract is implemented by Office. Keep the
        # workflow API, provider webhooks, and docs on the orchestrator below.
        location ^~ /mobile-api/ {
            proxy_pass http://127.0.0.1:8700;
            include /opt/floodman/unified/proxy-headers.conf;
        }

        location / {
            proxy_pass http://127.0.0.1:9004;
            include /opt/floodman/unified/proxy-headers.conf;
        }
    }
}
