[supervisord]
nodaemon=true
logfile=/home/container/data/logs/supervisord.log
pidfile=/home/container/data/runtime/supervisord.pid
childlogdir=/home/container/data/logs

[program:llama]
priority=10
command=/opt/floodman/scripts/llama-server.sh
autostart=true
autorestart=true
startsecs=8
startretries=5
stdout_logfile=/home/container/data/logs/llama.log
stderr_logfile=/home/container/data/logs/llama.log
stopasgroup=true
killasgroup=true
environment=HOME="/home/container",HF_HOME="/home/container/data/models/huggingface"

[program:floodman-control]
priority=20
command=/opt/floodman/scripts/wait-for-ready.sh http://127.0.0.1:8081/health 600 /opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8003 --workers 1 --no-access-log
directory=/opt/floodman
autostart=true
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/home/container/data/logs/appliance.log
stderr_logfile=/home/container/data/logs/appliance.log
stopasgroup=true
killasgroup=true
environment=PYTHONPATH="/opt/floodman",HOME="/home/container",HF_HOME="/home/container/data/models/huggingface"

[program:asterisk]
priority=30
command=/opt/floodman/scripts/wait-for-ready.sh http://127.0.0.1:8003/ready 900 /usr/sbin/asterisk -f -C /home/container/data/asterisk/etc/asterisk.conf
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/home/container/data/logs/asterisk-console.log
stderr_logfile=/home/container/data/logs/asterisk-console.log
stopasgroup=true
killasgroup=true
