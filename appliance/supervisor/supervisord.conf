[supervisord]
nodaemon=true
logfile=%(ENV_DATA_DIR)s/logs/supervisord.log
pidfile=%(ENV_DATA_DIR)s/runtime/supervisord.pid
childlogdir=%(ENV_DATA_DIR)s/logs

[program:llama]
priority=10
command=/opt/floodman/scripts/llama-server.sh
autostart=true
autorestart=true
startsecs=8
startretries=5
stdout_logfile=%(ENV_DATA_DIR)s/logs/llama.log
redirect_stderr=true
stdout_logfile_maxbytes=25MB
stdout_logfile_backups=3
stopasgroup=true
killasgroup=true
environment=HOME="/home/container",HF_HOME="%(ENV_DATA_DIR)s/models/huggingface"

[program:floodman-control]
priority=20
command=/opt/floodman/scripts/wait-for-ready.sh http://127.0.0.1:8081/health 600 /opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port %(ENV_WEB_PORT)s --workers 1 --no-access-log
directory=/opt/floodman
autostart=true
autorestart=true
startsecs=10
startretries=5
stdout_logfile=%(ENV_DATA_DIR)s/logs/appliance.log
redirect_stderr=true
stdout_logfile_maxbytes=25MB
stdout_logfile_backups=3
stopasgroup=true
killasgroup=true
environment=PYTHONPATH="/opt/tel-agent:/opt/floodman",HOME="/home/container",HF_HOME="%(ENV_DATA_DIR)s/models/huggingface"

[program:asterisk]
priority=30
command=/opt/floodman/scripts/wait-for-ready.sh http://127.0.0.1:%(ENV_WEB_PORT)s/ready 900 /usr/sbin/asterisk -f -C %(ENV_DATA_DIR)s/asterisk/etc/asterisk.conf
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=%(ENV_DATA_DIR)s/logs/asterisk-console.log
redirect_stderr=true
stdout_logfile_maxbytes=25MB
stdout_logfile_backups=3
stopasgroup=true
killasgroup=true
