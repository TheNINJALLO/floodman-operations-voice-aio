name: Build and verify isolated local streaming trial

"on":
  push:
    branches: [codex/local-streaming-trial]
    paths: ["appliance/**", ".github/workflows/build-local-streaming-trial.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: local-streaming-trial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appliance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: python -m py_compile app/*.py scripts/*.py

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build CPU streaming trial
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./appliance
          file: ./appliance/Dockerfile.local-trial
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:cpu-local-trial-${{ github.sha }}
          cache-from: type=gha,scope=local-streaming-trial
          cache-to: type=gha,mode=max,scope=local-streaming-trial
      - name: Prepare pinned public models in a test-only volume
        run: |
          docker volume create local-streaming-trial-models
          docker run --rm --mount type=volume,source=local-streaming-trial-models,target=/home/container/data --entrypoint /opt/venv/bin/python '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}' /opt/floodman/scripts/download_local_trial.py --with-whisper
      - name: Verify real CPU speech without network or a carrier
        run: >-
          docker run --rm --network none --read-only --cpus 4 --memory 6g
          --mount type=volume,source=local-streaming-trial-models,target=/home/container/data
          --entrypoint /opt/venv/bin/python '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}'
          /opt/floodman/scripts/benchmark_local_speech.py --contacts --strict
      - name: Verify pinned local 8B inference without network or a carrier
        run: >-
          docker run --rm --network none --read-only --cpus 4 --memory 6500m
          --mount type=volume,source=local-streaming-trial-models,target=/home/container/data
          --entrypoint /opt/venv/bin/python '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}'
          /opt/floodman/scripts/smoke_local_trial_llm.py
      - name: Verify Asterisk handoff is preserved
        run: >-
          docker run --rm --network none --read-only --tmpfs /home/container/data:rw,uid=988,gid=988
          -e LOCAL_VOICE_STACK=standard
          --entrypoint /opt/venv/bin/python '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}'
          /opt/floodman/scripts/smoke_transfer_handoff.py
      - name: Record immutable image
        run: echo '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Collect synthetic samples and benchmark reports
        run: |
          mkdir trial-results
          docker run --rm --network none --mount type=volume,source=local-streaming-trial-models,target=/home/container/data --entrypoint /bin/sh '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}' -c 'cd /home/container/data/benchmark && tar -cf - -- *.wav *.json' | tar -xf - -C trial-results
      - uses: actions/upload-artifact@v4
        with:
          name: local-voice-trial-samples
          path: trial-results
