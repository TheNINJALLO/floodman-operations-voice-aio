name: Install GPU Appliance Into Current Floodman AIO v2

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/install-gpu-appliance-into-aio.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read
  pull-requests: write

concurrency:
  group: install-floodman-gpu-appliance
  cancel-in-progress: false

jobs:
  install:
    name: Add, test, and publish the RTX A1000 appliance track
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out current AIO main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow bootstrap dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check             "PyYAML>=6,<7"
          python - <<'PY_BOOTSTRAP'
          import yaml
          print(f"PyYAML ready: {yaml.__version__}")
          PY_BOOTSTRAP

      - name: Create isolated appliance branch
        shell: bash
        run: git checkout -B self-hosted-gpu-appliance origin/main

      - name: Install appliance source
        shell: bash
        run: |
          rm -rf appliance
          mkdir -p appliance .github/workflows

          printf '%s' '' \
            | base64 -d > /tmp/floodman-gpu-appliance.tar.gz
          tar -xzf /tmp/floodman-gpu-appliance.tar.gz \
            -C appliance \
            --strip-components=1
          rm -f /tmp/floodman-gpu-appliance.tar.gz

          printf '%s' '' \
            | base64 -d > .github/workflows/ci-gpu-appliance.yml
          printf '%s' '' \
            | base64 -d > GPU-APPLIANCE.md

      - name: Verify repository integration
        shell: bash
        run: |
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json
          import yaml

          root = Path("appliance")
          required = (
              root / "Dockerfile",
              root / "pyproject.toml",
              root / "app/voice_core.py",
              root / "scripts/entrypoint.sh",
              root / "pterodactyl/egg-floodman-voice-appliance.json",
          )
          for path in required:
              assert path.is_file(), path

          egg = json.loads(
              (
                  root
                  / "pterodactyl/egg-floodman-voice-appliance.json"
              ).read_text(encoding="utf-8")
          )
          assert list(egg["docker_images"].values()) == [
              "ghcr.io/theninjallo/"
              "floodman-operations-voice-aio:gpu-appliance"
          ]

          workflow = yaml.safe_load(
              Path(
                  ".github/workflows/ci-gpu-appliance.yml"
              ).read_text(encoding="utf-8")
          )
          assert workflow["name"] == "Build Floodman GPU Appliance"

          contract = (
              root / "tests/test_contracts.py"
          ).read_text(encoding="utf-8")
          assert "floodman-operations-voice-aio:gpu-appliance" in contract
          assert '["Floodman Voice Appliance"]' not in contract
          PY_VERIFY

          python -m py_compile \
            appliance/app/*.py \
            appliance/scripts/*.py \
            appliance/tests/*.py
          bash -n appliance/scripts/*.sh
          git diff --check

      - name: Install appliance test dependencies
        run: pip install -e './appliance[dev]'

      - name: Run appliance test suite
        run: python -m pytest appliance/tests -q

      - name: Commit the isolated appliance track
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            appliance \
            .github/workflows/ci-gpu-appliance.yml \
            GPU-APPLIANCE.md

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m \
              "feat: add self-hosted RTX A1000 voice appliance"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push generated appliance branch
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          git fetch origin \
            "+refs/heads/self-hosted-gpu-appliance:refs/remotes/origin/self-hosted-gpu-appliance" \
            || true

          if git show-ref --verify --quiet \
            refs/remotes/origin/self-hosted-gpu-appliance; then
            LEASE_SHA="$(
              git rev-parse \
                refs/remotes/origin/self-hosted-gpu-appliance
            )"
            git push \
              --force-with-lease=refs/heads/self-hosted-gpu-appliance:${LEASE_SHA} \
              origin \
              HEAD:refs/heads/self-hosted-gpu-appliance
          else
            git push \
              origin \
              HEAD:refs/heads/self-hosted-gpu-appliance
          fi

          REMOTE_SHA="$(
            git ls-remote origin \
              refs/heads/self-hosted-gpu-appliance |
            awk '{print $1}'
          )"
          if [[ "${REMOTE_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Remote branch is ${REMOTE_SHA}; expected ${EXPECTED_SHA}."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve appliance image name
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}"             >> "$GITHUB_ENV"

      - name: Build and publish the exact tested appliance image
        uses: docker/build-push-action@v6
        with:
          context: ./appliance
          file: ./appliance/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:gpu-appliance
            ${{ env.IMAGE }}:gpu-appliance-${{ steps.commit.outputs.sha }}
          cache-from: type=gha,scope=gpu-appliance
          cache-to: type=gha,mode=max,scope=gpu-appliance
          provenance: mode=max

      - name: Upload the tested Pterodactyl egg
        uses: actions/upload-artifact@v4
        with:
          name: floodman-gpu-appliance-pterodactyl-egg
          path: appliance/pterodactyl/egg-floodman-voice-appliance.json
          if-no-files-found: error

      - name: Open or refresh the integration pull request
        id: pull_request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          PR_NUMBER="$(
            gh pr list \
              --head self-hosted-gpu-appliance \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          BODY="$(cat <<'EOF'
          Adds the clean, self-hosted Floodman Voice Appliance to the current
          AIO repository under `appliance/`.

          The existing root AIO implementation and `latest` image are not
          replaced. GitHub Actions publishes the new test image as:

          `ghcr.io/theninjallo/floodman-operations-voice-aio:gpu-appliance`

          The included Pterodactyl egg points to that isolated tag. Merge only
          after reviewing the successful appliance tests and CUDA image build.
          EOF
          )"

          if [[ -z "${PR_NUMBER}" ]]; then
            gh pr create \
              --base main \
              --head self-hosted-gpu-appliance \
              --title "Add self-hosted RTX A1000 voice appliance" \
              --body "${BODY}"
          else
            gh pr edit "${PR_NUMBER}" \
              --title "Add self-hosted RTX A1000 voice appliance" \
              --body "${BODY}"
          fi

          PR_STATUS=$?
          if [[ "${PR_STATUS}" -ne 0 ]]; then
            echo "GitHub did not allow Actions to create or edit the PR."
            echo "The branch and image are complete; open the PR manually:"
            echo "https://github.com/${GITHUB_REPOSITORY}/compare/main...self-hosted-gpu-appliance"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### GPU appliance added to the current AIO repository" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: self-hosted-gpu-appliance" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: appliance/" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ghcr.io/theninjallo/floodman-operations-voice-aio:gpu-appliance" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing latest image: unchanged" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- First image build: performed directly by this installer" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Pull request: created automatically when repository policy allows" \
            >> "$GITHUB_STEP_SUMMARY"
