name: Repair Floodman Live Call Path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-live-call-path.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-live-call-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Patch and validate inbound and outbound calling
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply live-call repair
        shell: bash
        run: |
          python - <<'PY_PATCH'
          from pathlib import Path
          import textwrap

          root = Path(".").resolve()

          def d(value: str) -> str:
              return textwrap.dedent(value).lstrip("\n")

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          def replace_all(path: Path, old: str, new: str, expected: int, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  if text.count(new) >= expected:
                      return
                  raise SystemExit(f"{label}: anchor not found")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} anchors, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          # AMI responses and events share one stream. Match the actual response
          # by ActionID instead of treating the first unrelated event as rejection.
          ami = root / "app/outbound/ami.py"
          replace_once(
              ami,
              d(r'''
                  @staticmethod
                  async def _send_action(
                      writer: asyncio.StreamWriter,
                      reader: asyncio.StreamReader,
                      fields: list[tuple[str, str]],
                      timeout: float,
                  ) -> dict[str, str]:
                      for _, value in fields:
                          if not _SAFE_VALUE.match(value):
                              raise ValueError("AMI field values may not contain CR or LF characters")
                      payload = "".join(f"{key}: {value}\r\n" for key, value in fields) + "\r\n"
                      writer.write(payload.encode("utf-8"))
                      await writer.drain()
                      return await AMIClient._read_block(reader, timeout)
              '''),
              d(r'''
                  @staticmethod
                  async def _send_action(
                      writer: asyncio.StreamWriter,
                      reader: asyncio.StreamReader,
                      fields: list[tuple[str, str]],
                      timeout: float,
                  ) -> dict[str, str]:
                      for _, value in fields:
                          if not _SAFE_VALUE.match(value):
                              raise ValueError("AMI field values may not contain CR or LF characters")
                      payload = "".join(f"{key}: {value}\r\n" for key, value in fields) + "\r\n"
                      writer.write(payload.encode("utf-8"))
                      await writer.drain()

                      action_id = next(
                          (value for key, value in fields if key.strip().lower() == "actionid"),
                          "",
                      )
                      deadline = asyncio.get_running_loop().time() + timeout
                      while True:
                          remaining = deadline - asyncio.get_running_loop().time()
                          if remaining <= 0:
                              raise asyncio.TimeoutError(
                                  f"Timed out waiting for AMI response to {action_id or 'action'}"
                              )
                          block = await AMIClient._read_block(reader, remaining)
                          if block.get("Response") and (
                              not action_id or block.get("ActionID", "") == action_id
                          ):
                              return block
              '''),
              "AMI action-response parser",
          )
          replace_all(ami, '("Events", "on"),', '("Events", "call"),', 2, "AMI event mask")
          replace_all(
              ami,
              "reader, action_id, self.settings.ami_timeout_seconds + 5.0",
              "reader, action_id, min(3.0, self.settings.ami_timeout_seconds)",
              2,
              "AMI originate event wait",
          )

          # Normalize Pterodactyl booleans and model tier names, point the local
          # server at persistent model paths, and enter full mode only when the
          # model pack has been successfully installed.
          entry = root / "scripts/entrypoint.sh"
          replace_once(
              entry,
              d(r'''
                  if [[ "${AUTO_INSTALL_LOCAL_MODELS:-false}" == "true" && ! -f "${DATA_DIR}/models/.floodman-models-ready" ]]; then
                    "${AVA_RUNTIME_DIR}/scripts/model_setup.sh" \
                      --tier "${LOCAL_MODEL_TIER:-LIGHT}" \
                      --assume-yes \
                      --language "${LOCAL_MODEL_LANGUAGE:-en-US}"
                    touch "${DATA_DIR}/models/.floodman-models-ready"
                  fi
              '''),
              d(r'''
                  truthy() {
                    case "${1,,}" in
                      1|true|yes|on) return 0 ;;
                      *) return 1 ;;
                    esac
                  }

                  normalize_local_model_tier() {
                    case "${1^^}" in
                      LIGHT|LIGHT_CPU) printf '%s\n' "LIGHT_CPU" ;;
                      BALANCED|MEDIUM|MEDIUM_CPU) printf '%s\n' "MEDIUM_CPU" ;;
                      QUALITY|HEAVY|HEAVY_CPU) printf '%s\n' "HEAVY_CPU" ;;
                      *) echo "Invalid LOCAL_MODEL_TIER=$1; use LIGHT, BALANCED, QUALITY, LIGHT_CPU, MEDIUM_CPU, or HEAVY_CPU" >&2; return 1 ;;
                    esac
                  }

                  export LOCAL_STT_MODEL_PATH="${LOCAL_STT_MODEL_PATH:-${DATA_DIR}/models/stt/vosk-model-small-en-us-0.15}"
                  export LOCAL_LLM_MODEL_PATH="${LOCAL_LLM_MODEL_PATH:-${DATA_DIR}/models/llm/qwen2.5-1.5b-instruct-q4_k_m.gguf}"
                  export LOCAL_TTS_MODEL_PATH="${LOCAL_TTS_MODEL_PATH:-${DATA_DIR}/models/tts/en_US-lessac-medium.onnx}"
                  export LOCAL_TTS_BACKEND="${LOCAL_TTS_BACKEND:-piper}"

                  MODEL_READY_MARKER="${DATA_DIR}/models/.floodman-models-ready"
                  if [[ -f "${MODEL_READY_MARKER}" ]]; then
                    if [[ ! -d "${LOCAL_STT_MODEL_PATH}" || ! -f "${LOCAL_LLM_MODEL_PATH}" || ! -f "${LOCAL_TTS_MODEL_PATH}" || ! -f "${LOCAL_TTS_MODEL_PATH}.json" ]]; then
                      echo "Local model marker is stale; required model files are missing" >&2
                      rm -f "${MODEL_READY_MARKER}"
                    fi
                  fi

                  if truthy "${AUTO_INSTALL_LOCAL_MODELS:-false}" && [[ ! -f "${MODEL_READY_MARKER}" ]]; then
                    RESOLVED_MODEL_TIER="$(normalize_local_model_tier "${LOCAL_MODEL_TIER:-LIGHT}")"
                    "${AVA_RUNTIME_DIR}/scripts/model_setup.sh" \
                      --tier "${RESOLVED_MODEL_TIER}" \
                      --assume-yes \
                      --language "${LOCAL_MODEL_LANGUAGE:-en-US}"
                    test -d "${LOCAL_STT_MODEL_PATH}"
                    test -f "${LOCAL_LLM_MODEL_PATH}"
                    test -f "${LOCAL_TTS_MODEL_PATH}"
                    test -f "${LOCAL_TTS_MODEL_PATH}.json"
                    touch "${MODEL_READY_MARKER}"
                  fi

                  if [[ -f "${MODEL_READY_MARKER}" ]]; then
                    export LOCAL_AI_MODE="${LOCAL_AI_MODE:-full}"
                  else
                    export LOCAL_AI_MODE="${LOCAL_AI_MODE:-minimal}"
                  fi
              '''),
              "local-model startup block",
          )
          replace_once(
              entry,
              '--pack-version "${KNOWLEDGE_PACK_VERSION:-2026-08-12.1}"',
              '--pack-version "${KNOWLEDGE_PACK_VERSION:-2026-08-13.1}"',
              "runtime configuration migration version",
          )

          # Turn local_hybrid into a genuinely all-local pipeline and redirect a
          # provider-start failure into the Asterisk fail-safe dialplan.
          overlay = root / "config/ava/ai-agent.local.yaml"
          overlay_text = overlay.read_text(encoding="utf-8")
          overlay_anchor = 'active_pipeline: "${AVA_PIPELINE:-local_hybrid}"\n'
          overlay_addition = d(r'''
              active_pipeline: "${AVA_PIPELINE:-local_hybrid}"

              on_provider_failure: "dialplan_redirect"
              provider_failure_redirect_context: "floodman-provider-failure"
              provider_failure_redirect_extension: "s"
              provider_failure_redirect_priority: 1

              pipelines:
                local_hybrid:
                  llm: local_llm

              providers:
                local_llm:
                  enabled: true
                  ws_url: "${LOCAL_WS_URL:-ws://127.0.0.1:8765}"
                  auth_token: "${LOCAL_WS_AUTH_TOKEN:-}"
          ''')
          if 'provider_failure_redirect_context: "floodman-provider-failure"' not in overlay_text:
              if overlay_text.count(overlay_anchor) != 1:
                  raise SystemExit("AVA overlay anchor missing or duplicated")
              overlay.write_text(
                  overlay_text.replace(overlay_anchor, overlay_addition, 1),
                  encoding="utf-8",
                  newline="\n",
              )

          # Add a carrier-independent inbound playback/echo test and make the
          # provider fallback use Gosub so Return() has a valid stack frame.
          render = root / "scripts/render_asterisk.py"
          replace_once(
              render,
              d(r'''
                  recording_disclosure = env_bool("CALL_RECORDING_DISCLOSURE_ENABLED", True)

                  # MixMonitor inbound lines — inserted after Answer(), before AGI gate_start.
              '''),
              d(r'''
                  recording_disclosure = env_bool("CALL_RECORDING_DISCLOSURE_ENABLED", True)

                  inbound_test_mode = env("INBOUND_TEST_MODE", "off").strip().lower()
                  if inbound_test_mode not in {"off", "playback", "echo"}:
                      raise ValueError("INBOUND_TEST_MODE must be off, playback, or echo")
                  inbound_test_lines = ""
                  if inbound_test_mode == "playback":
                      inbound_test_lines = (
                          " same => n,Wait(1)\n"
                          " same => n,Playback(demo-congrats)\n"
                          " same => n,Hangup()\n"
                      )
                  elif inbound_test_mode == "echo":
                      inbound_test_lines = (
                          " same => n,Wait(1)\n"
                          " same => n,Playback(demo-echotest)\n"
                          " same => n,Echo()\n"
                          " same => n,Hangup()\n"
                      )

                  # MixMonitor inbound lines — inserted after Answer(), before AGI gate_start.
              '''),
              "inbound diagnostic mode",
          )
          replace_once(
              render,
              d(r'''
                   same => n,Answer()
                  {rec_inbound_lines.rstrip()}
                   same => n,AGI({agi / 'agi_gate_start.py'})
              '''),
              d(r'''
                   same => n,Answer()
                  {inbound_test_lines.rstrip()}
                  {rec_inbound_lines.rstrip()}
                   same => n,AGI({agi / 'agi_gate_start.py'})
              '''),
              "inbound diagnostic dialplan",
          )
          replace_once(
              render,
              d(r'''
                  [floodman-provider-failure]
                  exten => s,1,NoOp(Floodman AVA provider failure fallback)
                   same => n,Goto(from-internal,{env('FLOODMAN_LIVE_EXTENSION','6000')},1)
              '''),
              d(r'''
                  [floodman-provider-failure]
                  exten => s,1,NoOp(Floodman AVA provider failure fallback)
                   same => n,Gosub(from-internal,{env('FLOODMAN_LIVE_EXTENSION','6000')},1)
                   same => n,Hangup()
              '''),
              "provider failure fallback",
          )

          (root / "tests/test_live_call_path.py").write_text(
              d(r'''
                  from __future__ import annotations

                  import asyncio
                  from pathlib import Path

                  import pytest
                  import yaml

                  from app.outbound.ami import AMIClient


                  class _Writer:
                      def __init__(self) -> None:
                          self.payload = b""

                      def write(self, value: bytes) -> None:
                          self.payload += value

                      async def drain(self) -> None:
                          return None


                  @pytest.mark.asyncio
                  async def test_ami_action_response_skips_unrelated_event() -> None:
                      reader = asyncio.StreamReader()
                      reader.feed_data(
                          b"Event: FullyBooted\r\nPrivilege: system,all\r\n\r\n"
                          b"Response: Success\r\nActionID: wanted\r\n"
                          b"Message: Originate successfully queued\r\n\r\n"
                      )
                      writer = _Writer()
                      result = await AMIClient._send_action(
                          writer,  # type: ignore[arg-type]
                          reader,
                          [
                              ("Action", "Originate"),
                              ("ActionID", "wanted"),
                              ("Channel", "PJSIP/+12315550100@floodman-trunk"),
                          ],
                          1.0,
                      )
                      assert result["Response"] == "Success"
                      assert result["ActionID"] == "wanted"
                      assert b"ActionID: wanted" in writer.payload


                  def test_live_call_runtime_contract(project_root: Path) -> None:
                      entrypoint = (project_root / "scripts/entrypoint.sh").read_text(encoding="utf-8")
                      renderer = (project_root / "scripts/render_asterisk.py").read_text(encoding="utf-8")
                      overlay = yaml.safe_load(
                          (project_root / "config/ava/ai-agent.local.yaml").read_text(encoding="utf-8")
                      )

                      assert "normalize_local_model_tier" in entrypoint
                      assert "LOCAL_STT_MODEL_PATH" in entrypoint
                      assert "LOCAL_LLM_MODEL_PATH" in entrypoint
                      assert "LOCAL_TTS_MODEL_PATH" in entrypoint
                      assert "2026-08-13.1" in entrypoint
                      assert 'INBOUND_TEST_MODE", "off"' in renderer
                      assert "Playback(demo-echotest)" in renderer
                      assert "Gosub(from-internal" in renderer
                      assert overlay["pipelines"]["local_hybrid"]["llm"] == "local_llm"
                      assert overlay["providers"]["local_llm"]["enabled"] is True
                      assert overlay["on_provider_failure"] == "dialplan_redirect"
              '''),
              encoding="utf-8",
              newline="\n",
          )
          PY_PATCH

      - name: Install test dependencies
        run: pip install -e '.[dev]'

      - name: Run focused live-call tests
        run: python -m pytest tests/test_live_call_path.py -q

      - name: Run complete test suite
        run: python -m pytest tests/ -x -q

      - name: Compile and validate
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          git diff --check

      - name: Commit tested repair
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/outbound/ami.py \
            scripts/entrypoint.sh \
            scripts/render_asterisk.py \
            config/ava/ai-agent.local.yaml \
            tests/test_live_call_path.py

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Live-call repair is already installed."
          else
            git commit -m "fix: stabilize Twilio test calls and local inbound AI"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch full and lite container builds
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-container.yml --ref main

      - name: Summary
        run: |
          echo "### Floodman live-call repair" >> "$GITHUB_STEP_SUMMARY"
          echo "- AMI matches action responses by ActionID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pterodactyl booleans and local model tiers are normalized" >> "$GITHUB_STEP_SUMMARY"
          echo "- local_hybrid uses the bundled local LLM WebSocket" >> "$GITHUB_STEP_SUMMARY"
          echo "- INBOUND_TEST_MODE supports playback and echo diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "- Provider failures redirect to the human fallback" >> "$GITHUB_STEP_SUMMARY"
