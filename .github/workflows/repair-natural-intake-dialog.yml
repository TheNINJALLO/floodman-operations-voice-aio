name: Repair Floodman Natural Intake Dialog v4

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-natural-intake-dialog.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-natural-intake-dialog
  cancel-in-progress: false

jobs:
  repair:
    name: Remove scripted narration and restore complete listening v4
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install patch dependencies
        run: python -m pip install "PyYAML>=6.0,<7"

      - name: Apply natural intake dialog repair
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/install_natural_intake.py
          python /tmp/install_natural_intake.py
          rm -f /tmp/install_natural_intake.py

      - name: Verify generated source and configuration
        shell: bash
        run: |
          python -m py_compile \
            app/intake.py \
            app/intake_flow.py \
            app/business/service.py \
            app/ava/agents.py \
            scripts/apply_production_hybrid_ai.py \
            scripts/patch_ava_direct_tool_prompts.py \
            tests/test_direct_tool_prompts.py \
            tests/test_natural_intake_dialog.py \
            tests/test_complete_intake_transcripts.py \
            tests/test_conversation_stability.py

          python - <<'PY_VERIFY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(
              Path("config/ava/ai-agent.local.yaml").read_text(
                  encoding="utf-8"
              )
          )
          description = config["in_call_tools"][
              "floodman_capture_intake_progress"
          ]["description"].lower()
          assert "tool-only" in description
          assert "engine speaks" in description
          assert "classify the request silently" in description

          fluid_test = Path(
              "tests/test_fluid_intake.py"
          ).read_text(encoding="utf-8").lower()
          assert "not a service floodman offers" in fluid_test

          complete_test = Path(
              "tests/test_complete_intake_transcripts.py"
          ).read_text(encoding="utf-8").lower()
          assert "does not currently offer that service" in complete_test
          assert "does not currently offer roof repair" not in complete_test

          stability_test = Path(
              "tests/test_conversation_stability.py"
          ).read_text(encoding="utf-8")
          assert (
              "${FLOODMAN_POST_TTS_END_PROTECTION_MS:-120}"
              in stability_test
          )
          assert (
              'post_tts_end_protection_ms"] == 750'
              not in stability_test
          )

          profile = Path(
              "scripts/apply_production_hybrid_ai.py"
          ).read_text(encoding="utf-8")
          assert "${DEEPGRAM_EOT_THRESHOLD:-0.82}" in profile
          assert "${DEEPGRAM_EOT_TIMEOUT_MS:-1500}" in profile
          assert (
              "${FLOODMAN_POST_TTS_END_PROTECTION_MS:-120}"
              in profile
          )

          dockerfile = Path("Dockerfile").read_text(
              encoding="utf-8"
          )
          assert "patch_ava_direct_tool_prompts.py" in dockerfile
          assert "Floodman direct tool continuation patch" in dockerfile
          PY_VERIFY

          git diff --check

      - name: Validate full patch chain against pinned AVA
        shell: bash
        run: |
          rm -rf /tmp/floodman-ava-natural-dialog
          git init /tmp/floodman-ava-natural-dialog
          git -C /tmp/floodman-ava-natural-dialog remote add origin \
            https://github.com/hkjarral/AVA-AI-Voice-Agent-for-Asterisk.git
          git -C /tmp/floodman-ava-natural-dialog fetch --depth 1 origin \
            18d4e769335f3b643aca80e084c7e66f0969491e
          git -C /tmp/floodman-ava-natural-dialog checkout --detach FETCH_HEAD

          python scripts/patch_ava.py \
            --ava-root /tmp/floodman-ava-natural-dialog
          python scripts/patch_ava_optional_params.py \
            --ava-root /tmp/floodman-ava-natural-dialog
          python scripts/patch_ava_production.py \
            --ava-root /tmp/floodman-ava-natural-dialog
          python scripts/patch_ava_groq_resilience.py \
            --ava-root /tmp/floodman-ava-natural-dialog
          python scripts/patch_ava_groq_model_fallback.py \
            --ava-root /tmp/floodman-ava-natural-dialog
          python scripts/patch_ava_flux.py \
            --ava-root /tmp/floodman-ava-natural-dialog
          python scripts/patch_ava_direct_tool_prompts.py \
            --ava-root /tmp/floodman-ava-natural-dialog

          python -m py_compile \
            /tmp/floodman-ava-natural-dialog/src/engine.py \
            /tmp/floodman-ava-natural-dialog/src/pipelines/openai.py \
            /tmp/floodman-ava-natural-dialog/src/pipelines/deepgram_flux.py

          python - <<'PY_AVA'
          from pathlib import Path

          engine = Path(
              "/tmp/floodman-ava-natural-dialog/src/engine.py"
          ).read_text(encoding="utf-8")
          assert "Floodman direct tool continuation patch" in engine
          assert "Direct tool continuation response" in engine
          assert "_floodman_direct_tool_payload(result)" in engine
          assert "end_call_after_message" in engine
          PY_AVA

      - name: Install project test dependencies
        run: pip install -e '.[dev]'

      - name: Run natural-dialog regression tests
        run: |
          python -m pytest \
            tests/test_direct_tool_prompts.py \
            tests/test_natural_intake_dialog.py \
            tests/test_fluid_intake.py \
            tests/test_intake_continuation.py \
            tests/test_single_field_intake_flow.py \
            tests/test_complete_intake_transcripts.py \
            tests/test_conversation_stability.py \
            -q

      - name: Run complete repository tests
        run: python -m pytest tests/ -q

      - name: Compile and validate repository
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          git diff --check

      - name: Commit tested natural-dialog repair
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Dockerfile \
            app/intake.py \
            app/intake_flow.py \
            app/business/service.py \
            app/ava/agents.py \
            config/ava/ai-agent.local.yaml \
            scripts/apply_production_hybrid_ai.py \
            scripts/patch_ava_direct_tool_prompts.py \
            tests/test_direct_tool_prompts.py \
            tests/test_natural_intake_dialog.py \
            tests/test_fluid_intake.py \
            tests/test_intake_continuation.py \
            tests/test_single_field_intake_flow.py \
            tests/test_complete_intake_transcripts.py \
            tests/test_conversation_stability.py \
            tests/test_fast_intake_team_sms.py \
            .env.twilio.example

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "fix: make voice intake direct and natural"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for GitHub main to expose the exact source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          for attempt in $(seq 1 40); do
            REMOTE_SHA="$(
              git ls-remote origin refs/heads/main |
              awk '{print $1}'
            )"
            if [[ "${REMOTE_SHA}" == "${EXPECTED_SHA}" ]]; then
              echo "GitHub main is at ${EXPECTED_SHA}"
              exit 0
            fi
            sleep 3
          done

          echo "GitHub main did not expose ${EXPECTED_SHA} in time."
          exit 1

      - name: Resolve or dispatch exact-SHA container build
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          SUCCESS_RUN_ID="$(
            gh run list \
              --workflow ci-container.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,headSha,status,conclusion |
            jq -r --arg sha "${EXPECTED_SHA}" '
              [
                .[]
                | select(
                    .headSha == $sha
                    and .status == "completed"
                    and .conclusion == "success"
                  )
              ]
              | sort_by(.databaseId)
              | last
              | .databaseId // empty
            '
          )"

          if [[ -n "${SUCCESS_RUN_ID}" ]]; then
            echo "run_id=${SUCCESS_RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci-container.yml --ref main

          for attempt in $(seq 1 40); do
            RUN_ID="$(
              gh run list \
                --workflow ci-container.yml \
                --branch main \
                --event workflow_dispatch \
                --limit 50 \
                --json databaseId,headSha,createdAt |
              jq -r \
                --arg sha "${EXPECTED_SHA}" \
                --arg dispatched "${DISPATCHED_AT}" '
                  [
                    .[]
                    | select(
                        .headSha == $sha
                        and .createdAt >= $dispatched
                      )
                  ]
                  | sort_by(.databaseId)
                  | last
                  | .databaseId // empty
                '
            )"
            if [[ -n "${RUN_ID}" ]]; then
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done

          echo "No newly dispatched container run targeted ${EXPECTED_SHA}."
          exit 1

      - name: Wait for full and lite images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          RUN_SHA="$(
            gh run view "${RUN_ID}" --json headSha --jq '.headSha'
          )"
          if [[ "${RUN_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Run ${RUN_ID} targets ${RUN_SHA}, expected ${EXPECTED_SHA}."
            exit 1
          fi

          STATUS="$(
            gh run view "${RUN_ID}" --json status --jq '.status'
          )"
          if [[ "${STATUS}" == "completed" ]]; then
            CONCLUSION="$(
              gh run view "${RUN_ID}" \
                --json conclusion \
                --jq '.conclusion'
            )"
            if [[ "${CONCLUSION}" != "success" ]]; then
              echo "Container run ${RUN_ID} completed with ${CONCLUSION}."
              exit 1
            fi
            exit 0
          fi

          gh run watch "${RUN_ID}" --exit-status --interval 10

      - name: Summary
        run: |
          echo "### Natural Floodman intake installed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Speaks tool safe_message directly without a second LLM rewrite" >> "$GITHUB_STEP_SUMMARY"
          echo "- Removes repeated recorded-information narration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Uses short natural collection and confirmation prompts" >> "$GITHUB_STEP_SUMMARY"
          echo "- Raises Flux turn confidence and protects email/address endings" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reduces the post-TTS deaf window from 750 ms to 120 ms" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatically ends the call after the final callback notice" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publishes full and lite images from the exact tested SHA" >> "$GITHUB_STEP_SUMMARY"
