name: Repair Floodman Single-Field Intake Flow

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-single-field-intake.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-single-field-intake
  cancel-in-progress: false

jobs:
  repair:
    name: Confirm one field at a time and remove dead air
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install patch dependencies
        run: python -m pip install "PyYAML>=6.0,<7"

      - name: Apply deterministic single-field intake flow
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/repair_single_field_intake.py
          python /tmp/repair_single_field_intake.py
          rm -f /tmp/repair_single_field_intake.py

      - name: Verify generated syntax and configuration
        shell: bash
        run: |
          python -m py_compile \
            app/intake_flow.py \
            app/business/service.py \
            app/ava/agents.py \
            scripts/apply_production_hybrid_ai.py \
            tests/test_single_field_intake_flow.py \
            tests/test_intake_continuation.py \
            tests/test_complete_intake_transcripts.py
          python - <<'PY_VERIFY'
          import yaml
          from pathlib import Path

          config = yaml.safe_load(
              Path("config/ava/ai-agent.local.yaml").read_text(
                  encoding="utf-8"
              )
          )
          tool = config["in_call_tools"][
              "floodman_capture_intake_progress"
          ]
          names = {
              parameter["name"]
              for parameter in tool["parameters"]
          }
          assert "confirm_field" in names
          assert "confirmation" in names
          assert '"confirm_field":"{confirm_field}"' in tool[
              "body_template"
          ]
          assert '"confirmation":"{confirmation}"' in tool[
              "body_template"
          ]
          PY_VERIFY
          git diff --check

      - name: Install project test dependencies
        run: pip install -e '.[dev]'

      - name: Run single-field intake tests
        run: |
          python -m pytest \
            tests/test_single_field_intake_flow.py \
            tests/test_intake_continuation.py \
            -q

      - name: Run complete intake and transcript tests
        run: python -m pytest tests/test_complete_intake_transcripts.py -q

      - name: Run full repository tests
        run: python -m pytest tests/ -x -q

      - name: Compile and validate repository
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          git diff --check

      - name: Commit tested single-field flow
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/intake_flow.py \
            app/business/service.py \
            app/ava/agents.py \
            config/ava/ai-agent.local.yaml \
            scripts/apply_production_hybrid_ai.py \
            tests/test_single_field_intake_flow.py \
            tests/test_intake_continuation.py \
            tests/test_complete_intake_transcripts.py \
            tests/test_fast_intake_team_sms.py \
            .env.twilio.example

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Single-field intake flow is already installed."
          else
            git commit -m "fix: confirm intake details one field at a time"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch full and lite container builds
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-container.yml --ref main

      - name: Summary
        run: |
          echo "### Floodman single-field intake flow" >> "$GITHUB_STEP_SUMMARY"
          echo "- Asks exactly one question per turn" >> "$GITHUB_STEP_SUMMARY"
          echo "- Confirms name, then email, then phone, then address" >> "$GITHUB_STEP_SUMMARY"
          echo "- Saves volunteered extra fields without re-asking them" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requires a separate yes/no confirmation for each contact field" >> "$GITHUB_STEP_SUMMARY"
          echo "- Uses deterministic server prompts instead of LLM-generated question lists" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reduces STT, LLM, and playback latency defaults" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dispatches full and lite images after all tests pass" >> "$GITHUB_STEP_SUMMARY"
