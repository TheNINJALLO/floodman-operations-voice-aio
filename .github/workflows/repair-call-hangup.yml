name: Repair Floodman Call Hangup and True AI Readiness v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-call-hangup.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-call-hangup-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Patch local AI launch, AVA readiness, and inbound Stasis retry
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply call-hangup repair
        shell: bash
        run: |
          python - <<'PY_PATCH'
          from __future__ import annotations

          from pathlib import Path

          root = Path(".").resolve()

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          # Pterodactyl commonly supplies booleans as 1/0. The old launcher only
          # accepted the literal word "true", allowing Supervisor to keep a
          # sleeping process alive while no STT/LLM/TTS server existed.
          run_local_ai = root / "scripts/run_local_ai.sh"
          run_local_ai.write_text(
              r'''#!/usr/bin/env bash
          set -euo pipefail

          truthy() {
            case "${1,,}" in
              1|true|yes|on) return 0 ;;
              *) return 1 ;;
            esac
          }

          if ! truthy "${ENABLE_LOCAL_AI_SERVER:-true}"; then
            echo "Floodman local AI disabled by ENABLE_LOCAL_AI_SERVER=${ENABLE_LOCAL_AI_SERVER:-false}"
            exec sleep infinity
          fi

          AVA_RUNTIME_DIR="${AVA_RUNTIME_DIR:-${DATA_DIR:-/home/container/data}/runtime/ava}"
          LOCAL_AI_DIR="${AVA_RUNTIME_DIR}/local_ai_server"
          test -f "${LOCAL_AI_DIR}/main.py"
          test -f "${LOCAL_AI_DIR}/server.py"

          export PYTHONPATH="${LOCAL_AI_DIR}:${AVA_RUNTIME_DIR}${PYTHONPATH:+:${PYTHONPATH}}"
          cd "${AVA_RUNTIME_DIR}"

          echo "Starting Floodman local AI in ${LOCAL_AI_MODE:-auto} mode on ${LOCAL_WS_HOST:-127.0.0.1}:${LOCAL_WS_PORT:-8765}"
          exec /opt/venv/bin/python "${LOCAL_AI_DIR}/main.py"
          ''',
              encoding="utf-8",
              newline="\n",
          )

          # Supervisor previously marked the run_ava.sh wrapper RUNNING while it
          # was merely waiting. Publish readiness only after Asterisk confirms
          # the real ARI/Stasis application is registered. Remove the marker as
          # soon as the AVA process exits.
          run_ava = root / "scripts/run_ava.sh"
          run_ava.write_text(
              r'''#!/usr/bin/env bash
          set -euo pipefail

          truthy() {
            case "${1,,}" in
              1|true|yes|on) return 0 ;;
              *) return 1 ;;
            esac
          }

          if ! truthy "${AVA_ENABLED:-true}"; then
            exec sleep infinity
          fi

          DATA_DIR="${DATA_DIR:-/home/container/data}"
          AVA_RUNTIME_DIR="${AVA_RUNTIME_DIR:-${DATA_DIR}/runtime/ava}"
          AVA_READY_FILE="${DATA_DIR}/runtime/ava-stasis-ready"
          AVA_APP="${AVA_STASIS_APP:-asterisk-ai-voice-agent}"
          ARI_BASE_URL="http://127.0.0.1:${ARI_PORT:-8088}/ari"
          mkdir -p "$(dirname "${AVA_READY_FILE}")"
          rm -f "${AVA_READY_FILE}"

          AVA_PID=""

          cleanup() {
            rm -f "${AVA_READY_FILE}"
            if [[ -n "${AVA_PID}" ]] && kill -0 "${AVA_PID}" >/dev/null 2>&1; then
              kill "${AVA_PID}" >/dev/null 2>&1 || true
              wait "${AVA_PID}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT INT TERM

          if [[ "${ASTERISK_MODE:-embedded}" == "embedded" ]]; then
            ARI_READY=0
            for _ in $(seq 1 "${ASTERISK_READY_TIMEOUT_SECONDS:-120}"); do
              if curl -fsS -u "${ARI_USERNAME}:${ARI_SECRET}" \
                "${ARI_BASE_URL}/asterisk/info" >/dev/null 2>&1; then
                ARI_READY=1
                break
              fi
              sleep 1
            done
            if [[ "${ARI_READY}" != "1" ]]; then
              echo "Asterisk ARI did not become ready before AVA startup" >&2
              exit 1
            fi
          fi

          USES_LOCAL_PIPELINE=0
          case "${AVA_PIPELINE:-local_hybrid},${AVA_PROVIDER:-local_hybrid},${DEFAULT_PROVIDER:-local_hybrid}" in
            *local*) USES_LOCAL_PIPELINE=1 ;;
          esac

          if truthy "${ENABLE_LOCAL_AI_SERVER:-true}" && [[ "${USES_LOCAL_PIPELINE}" == "1" ]]; then
            echo "Waiting for Floodman's Vosk, Qwen, Piper, and local WebSocket..."
            /opt/venv/bin/python - <<'PY_READY'
          import os
          import socket
          import sys
          import time

          host = os.getenv("LOCAL_WS_HOST", "127.0.0.1").strip() or "127.0.0.1"
          port = int(os.getenv("LOCAL_WS_PORT", "8765"))
          timeout = max(30, int(os.getenv("LOCAL_AI_READY_TIMEOUT_SECONDS", "600")))
          deadline = time.monotonic() + timeout
          last_error = ""

          while time.monotonic() < deadline:
              try:
                  with socket.create_connection((host, port), timeout=1.0):
                      print(f"Floodman local AI ready on {host}:{port}")
                      sys.exit(0)
              except OSError as exc:
                  last_error = str(exc)
                  time.sleep(1.0)

          print(
              f"Floodman local AI did not become ready on {host}:{port} "
              f"within {timeout}s: {last_error}",
              file=sys.stderr,
          )
          sys.exit(1)
          PY_READY
          fi

          test -f "${AVA_RUNTIME_DIR}/main.py"
          cd "${AVA_RUNTIME_DIR}"
          /opt/venv/bin/python "${AVA_RUNTIME_DIR}/main.py" &
          AVA_PID="$!"

          STASIS_READY=0
          CHECKS=$(( ${AVA_STASIS_READY_TIMEOUT_SECONDS:-180} * 2 ))
          for _ in $(seq 1 "${CHECKS}"); do
            if ! kill -0 "${AVA_PID}" >/dev/null 2>&1; then
              if wait "${AVA_PID}"; then
                exit 0
              else
                exit $?
              fi
            fi

            if curl -fsS -u "${ARI_USERNAME}:${ARI_SECRET}" \
              "${ARI_BASE_URL}/applications/${AVA_APP}" >/dev/null 2>&1; then
              STASIS_READY=1
              : > "${AVA_READY_FILE}"
              chmod 600 "${AVA_READY_FILE}"
              echo "Floodman AVA Stasis application ready: ${AVA_APP}"
              break
            fi
            sleep 0.5
          done

          if [[ "${STASIS_READY}" != "1" ]]; then
            echo "AVA process started but Stasis application ${AVA_APP} never registered" >&2
            exit 1
          fi

          if wait "${AVA_PID}"; then
            STATUS=0
          else
            STATUS=$?
          fi
          AVA_PID=""
          exit "${STATUS}"
          ''',
              encoding="utf-8",
              newline="\n",
          )

          # The live dialplan currently enters Stasis once and immediately hangs
          # up when STASISSTATUS=FAILED. Replace that trapdoor with a readiness
          # marker, one polite holding prompt, bounded retries, and the existing
          # human/provider fallback.
          renderer = root / "scripts/render_asterisk.py"

          app_expr = (
              "{safe(env('AVA_STASIS_APP','asterisk-ai-voice-agent'), "
              "r'[A-Za-z0-9_.-]+', 'Stasis app', False)}"
          )
          asterisk_open = "$" + "{{"
          asterisk_close = "}}"

          ai_agent = asterisk_open + "AI_AGENT" + asterisk_close
          ai_provider = asterisk_open + "AI_PROVIDER" + asterisk_close
          stasis_status = asterisk_open + "STASISSTATUS" + asterisk_close
          attempts = asterisk_open + "AVA_STASIS_ATTEMPTS" + asterisk_close
          ready = asterisk_open + "AVA_STASIS_READY" + asterisk_close

          old_inbound = (
              f' same => n(ava),Set(__AI_AGENT={asterisk_open}IF($["{ai_agent}"=""]?floodman_inbound:{ai_agent}){asterisk_close})\n'
              f' same => n,Set(__AI_PROVIDER={asterisk_open}IF($["{ai_provider}"=""]?'
              + "{env('DEFAULT_PROVIDER','local_hybrid')}:"
              + f'{ai_provider}){asterisk_close})\n'
              f" same => n,Stasis({app_expr})\n"
              f' same => n,GotoIf($["{stasis_status}"="FAILED"]?provider-failure)\n'
              " same => n,Hangup()\n"
              " same => n(provider-failure),Goto(floodman-provider-failure,s,1)"
          )

          marker = "{data_dir / 'runtime/ava-stasis-ready'}"
          stat_expr = (
              asterisk_open + f"STAT(e,{marker})" + asterisk_close
          )

          new_inbound = (
              f' same => n(ava),Set(__AI_AGENT={asterisk_open}IF($["{ai_agent}"=""]?floodman_inbound:{ai_agent}){asterisk_close})\n'
              f' same => n,Set(__AI_PROVIDER={asterisk_open}IF($["{ai_provider}"=""]?'
              + "{env('DEFAULT_PROVIDER','local_hybrid')}:"
              + f'{ai_provider}){asterisk_close})\n'
              " same => n,Set(__AVA_STASIS_ATTEMPTS=0)\n"
              f" same => n(ava-readiness),Set(AVA_STASIS_READY={stat_expr})\n"
              f' same => n,GotoIf($["{ready}"="1"]?ava-stasis)\n'
              f" same => n,Set(AVA_STASIS_ATTEMPTS=$[{attempts}+1])\n"
              f" same => n,GotoIf($[{attempts}=1]?ava-wait-message)\n"
              f" same => n,GotoIf($[{attempts}<45]?ava-wait)\n"
              " same => n,Goto(provider-failure)\n"
              " same => n(ava-wait-message),TryExec(Playback(one-moment-please))\n"
              " same => n(ava-wait),Wait(1)\n"
              " same => n,Goto(ava-readiness)\n"
              f" same => n(ava-stasis),Stasis({app_expr})\n"
              f' same => n,GotoIf($["{stasis_status}"="FAILED"]?ava-stasis-failed)\n'
              " same => n,Hangup()\n"
              f" same => n(ava-stasis-failed),Set(AVA_STASIS_ATTEMPTS=$[{attempts}+1])\n"
              f" same => n,GotoIf($[{attempts}<45]?ava-stasis-retry)\n"
              " same => n,Goto(provider-failure)\n"
              " same => n(ava-stasis-retry),Wait(1)\n"
              " same => n,Goto(ava-readiness)\n"
              " same => n(provider-failure),Goto(floodman-provider-failure,s,1)"
          )
          replace_once(
              renderer,
              old_inbound,
              new_inbound,
              "inbound caller-safe Stasis readiness",
          )

          old_outbound = (
              f" same => n,Stasis({app_expr})\n"
              " same => n,Hangup()\n"
              "exten => h,1,NoOp(Floodman outbound hangup handler)"
          )
          new_outbound = (
              f" same => n,Stasis({app_expr})\n"
              f' same => n,GotoIf($["{stasis_status}"="FAILED"]?outbound-provider-failure)\n'
              " same => n,Hangup()\n"
              " same => n(outbound-provider-failure),TryExec(Playback(sorry-youre-having-problems))\n"
              " same => n,Hangup()\n"
              "exten => h,1,NoOp(Floodman outbound hangup handler)"
          )
          replace_once(
              renderer,
              old_outbound,
              new_outbound,
              "outbound Stasis audible fallback",
          )

          legacy_readiness_test = root / "tests/test_ai_readiness_sip_security.py"
          if legacy_readiness_test.is_file():
              legacy_text = legacy_readiness_test.read_text(encoding="utf-8")
              old_legacy_function = '''def test_ava_waits_for_local_ai_before_starting(project_root: Path) -> None:
              script = (project_root / "scripts/run_ava.sh").read_text(encoding="utf-8")
              assert "LOCAL_AI_READY_TIMEOUT_SECONDS" in script
              assert "socket.create_connection" in script
              assert "Floodman local AI ready" in script
              assert script.index("socket.create_connection") < script.index(
                  'exec /opt/venv/bin/python "${AVA_RUNTIME_DIR}/main.py"'
              )
          '''
              new_legacy_function = '''def test_ava_waits_for_local_ai_before_starting(project_root: Path) -> None:
              script = (project_root / "scripts/run_ava.sh").read_text(encoding="utf-8")
              assert "LOCAL_AI_READY_TIMEOUT_SECONDS" in script
              assert "socket.create_connection" in script
              assert "Floodman local AI ready" in script
              assert "AVA_PID" in script
              assert "ava-stasis-ready" in script
              assert "/applications/${AVA_APP}" in script
              assert script.index("socket.create_connection") < script.index(
                  '/opt/venv/bin/python "${AVA_RUNTIME_DIR}/main.py" &'
              )
              assert script.index(
                  '/opt/venv/bin/python "${AVA_RUNTIME_DIR}/main.py" &'
              ) < script.index("/applications/${AVA_APP}")
          '''
              if new_legacy_function not in legacy_text:
                  if legacy_text.count(old_legacy_function) != 1:
                      raise SystemExit(
                          "legacy AVA readiness test: expected exactly one old contract"
                      )
                  legacy_readiness_test.write_text(
                      legacy_text.replace(
                          old_legacy_function,
                          new_legacy_function,
                          1,
                      ),
                      encoding="utf-8",
                      newline="\n",
                  )

          (root / "tests/test_call_hangup_readiness.py").write_text(
              r'''from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path


          def test_local_ai_launcher_accepts_pterodactyl_booleans(
              project_root: Path,
          ) -> None:
              script = (
                  project_root / "scripts/run_local_ai.sh"
              ).read_text(encoding="utf-8")
              assert "1|true|yes|on" in script
              assert '"${ENABLE_LOCAL_AI_SERVER:-true}" != "true"' not in script
              assert "Starting Floodman local AI" in script


          def test_ava_publishes_real_stasis_readiness(
              project_root: Path,
          ) -> None:
              script = (
                  project_root / "scripts/run_ava.sh"
              ).read_text(encoding="utf-8")
              assert "ava-stasis-ready" in script
              assert "/applications/${AVA_APP}" in script
              assert "Floodman AVA Stasis application ready" in script
              assert 'rm -f "${AVA_READY_FILE}"' in script
              assert 'wait "${AVA_PID}"' in script


          def test_inbound_call_waits_instead_of_immediate_hangup(
              project_root: Path,
              tmp_path: Path,
          ) -> None:
              env = os.environ.copy()
              env.update(
                  {
                      "DATA_DIR": str(tmp_path / "runtime"),
                      "ASTERISK_CONFIG_DIR": str(tmp_path / "runtime/asterisk/etc"),
                      "ASTERISK_MODULE_DIR": str(tmp_path / "modules"),
                      "SIP_TRUNK_MODE": "disabled",
                      "ARI_SECRET": "ari-test-secret",
                      "AMI_SECRET": "ami-test-secret",
                  }
              )
              subprocess.run(
                  ["python", str(project_root / "scripts/render_asterisk.py")],
                  check=True,
                  env=env,
                  cwd=project_root,
              )
              extensions = (
                  tmp_path / "runtime/asterisk/etc/extensions.conf"
              ).read_text(encoding="utf-8")

              marker = str(tmp_path / "runtime/runtime/ava-stasis-ready")
              assert f"STAT(e,{marker})" in extensions
              assert "TryExec(Playback(one-moment-please))" in extensions
              assert "AVA_STASIS_ATTEMPTS" in extensions
              assert "Goto(ava-readiness)" in extensions
              assert "ava-stasis-failed" in extensions
              assert "outbound-provider-failure" in extensions
          ''',
              encoding="utf-8",
              newline="\n",
          )
          PY_PATCH

      - name: Verify generated syntax
        shell: bash
        run: |
          python -m py_compile \
            scripts/render_asterisk.py \
            tests/test_call_hangup_readiness.py \
            tests/test_ai_readiness_sip_security.py
          bash -n scripts/run_local_ai.sh
          bash -n scripts/run_ava.sh

      - name: Install project test dependencies
        run: pip install -e '.[dev]'

      - name: Run focused call-readiness tests
        run: python -m pytest tests/test_call_hangup_readiness.py tests/test_ai_readiness_sip_security.py -q

      - name: Run complete repository tests
        run: python -m pytest tests/ -x -q

      - name: Compile and validate repository
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          git diff --check

      - name: Commit tested call-hangup repair
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/run_local_ai.sh \
            scripts/run_ava.sh \
            scripts/render_asterisk.py \
            tests/test_call_hangup_readiness.py \
            tests/test_ai_readiness_sip_security.py

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Call-hangup readiness repair is already installed."
          else
            git commit -m "fix: prevent calls hanging up before Ava is ready"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch full and lite container builds
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-container.yml --ref main

      - name: Summary
        run: |
          echo "### Floodman call-hangup readiness repair" >> "$GITHUB_STEP_SUMMARY"
          echo "- Local AI launcher accepts Pterodactyl 1/true/yes/on booleans" >> "$GITHUB_STEP_SUMMARY"
          echo "- AVA readiness is published only after its ARI application exists" >> "$GITHUB_STEP_SUMMARY"
          echo "- The readiness marker is removed immediately if AVA exits" >> "$GITHUB_STEP_SUMMARY"
          echo "- Inbound callers hear one holding prompt and wait up to 45 seconds" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed Stasis entry retries instead of immediately hanging up" >> "$GITHUB_STEP_SUMMARY"
          echo "- Persistent failure uses the configured human/provider fallback" >> "$GITHUB_STEP_SUMMARY"
