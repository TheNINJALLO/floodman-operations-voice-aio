name: Repair Floodman AI Readiness and SIP Edge Security

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-ai-readiness-sip.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-ai-readiness-sip-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Patch call-gate fail-open, AI startup order, and PJSIP identity
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply AI readiness and SIP repair
        shell: bash
        run: |
          python - <<'PY_PATCH'
          from __future__ import annotations

          from pathlib import Path

          root = Path(".").resolve()

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          run_ava = root / "scripts/run_ava.sh"
          run_ava.write_text(
              r'''#!/usr/bin/env bash
          set -euo pipefail

          truthy() {
            case "${1,,}" in
              1|true|yes|on) return 0 ;;
              *) return 1 ;;
            esac
          }

          if ! truthy "${AVA_ENABLED:-true}"; then
            exec sleep infinity
          fi

          if [[ "${ASTERISK_MODE:-embedded}" == "embedded" ]]; then
            ARI_READY=0
            for _ in $(seq 1 "${ASTERISK_READY_TIMEOUT_SECONDS:-120}"); do
              if curl -fsS -u "${ARI_USERNAME}:${ARI_SECRET}" \
                "http://127.0.0.1:${ARI_PORT:-8088}/ari/asterisk/info" >/dev/null 2>&1; then
                ARI_READY=1
                break
              fi
              sleep 1
            done
            if [[ "${ARI_READY}" != "1" ]]; then
              echo "Asterisk ARI did not become ready before AVA startup" >&2
              exit 1
            fi
          fi

          USES_LOCAL_PIPELINE=0
          case "${AVA_PIPELINE:-local_hybrid},${AVA_PROVIDER:-local_hybrid},${DEFAULT_PROVIDER:-local_hybrid}" in
            *local*) USES_LOCAL_PIPELINE=1 ;;
          esac

          if truthy "${ENABLE_LOCAL_AI_SERVER:-true}" && [[ "${USES_LOCAL_PIPELINE}" == "1" ]]; then
            echo "Waiting for the Floodman local AI models and WebSocket server..."
            /opt/venv/bin/python - <<'PY_READY'
          import os
          import socket
          import sys
          import time

          host = os.getenv("LOCAL_WS_HOST", "127.0.0.1").strip() or "127.0.0.1"
          port = int(os.getenv("LOCAL_WS_PORT", "8765"))
          timeout = max(30, int(os.getenv("LOCAL_AI_READY_TIMEOUT_SECONDS", "600")))
          deadline = time.monotonic() + timeout
          last_error = ""

          while time.monotonic() < deadline:
              try:
                  with socket.create_connection((host, port), timeout=1.0):
                      print(f"Floodman local AI ready on {host}:{port}")
                      sys.exit(0)
              except OSError as exc:
                  last_error = str(exc)
                  time.sleep(1.0)

          print(
              f"Floodman local AI did not become ready on {host}:{port} "
              f"within {timeout}s: {last_error}",
              file=sys.stderr,
          )
          sys.exit(1)
          PY_READY
            sleep 1
          fi

          AVA_RUNTIME_DIR="${AVA_RUNTIME_DIR:-${DATA_DIR:-/home/container/data}/runtime/ava}"
          test -f "${AVA_RUNTIME_DIR}/main.py"
          cd "${AVA_RUNTIME_DIR}"
          exec /opt/venv/bin/python "${AVA_RUNTIME_DIR}/main.py"
          ''',
              encoding="utf-8",
              newline="\n",
          )

          gate = root / "app/call_gate/audio_socket.py"
          old_gate = (
              "                audio_seconds = len(pcm) / max(1, sample_rate * 2)\n"
              "                due = elapsed - last_transcription >= self.settings.gate_transcribe_interval_seconds\n"
              "                enough_audio = audio_seconds >= max(0.7, self.settings.gate_min_seconds)\n"
              "                if due and enough_audio:\n"
          )
          new_gate = (
              "                audio_seconds = len(pcm) / max(1, sample_rate * 2)\n"
              "                due = elapsed - last_transcription >= self.settings.gate_transcribe_interval_seconds\n"
              "                minimum_audio_seconds = max(0.35, self.settings.gate_min_seconds)\n"
              "                enough_audio = audio_seconds >= minimum_audio_seconds\n"
              "\n"
              "                if not transcript and elapsed >= silence_timeout and not enough_audio:\n"
              "                    decision = machine.feed(\n"
              "                        \"\",\n"
              "                        source_hint=source_hint,\n"
              "                        did=did,\n"
              "                        caller_number=caller_number,\n"
              "                        elapsed_seconds=elapsed,\n"
              "                        timed_out=True,\n"
              "                    )\n"
              "                    decision.metadata[\"no_audio_fail_open\"] = True\n"
              "                    self.database.save_gate_decision(gate_uuid, decision)\n"
              "                    logger.info(\n"
              "                        \"Call gate failed open after %.2fs without enough opening audio for %s\",\n"
              "                        elapsed,\n"
              "                        gate_uuid,\n"
              "                    )\n"
              "                    break\n"
              "\n"
              "                if due and enough_audio:\n"
          )
          replace_once(
              gate,
              old_gate,
              new_gate,
              "wall-clock direct-call fail-open",
          )

          renderer = root / "scripts/render_asterisk.py"
          old_twilio_def = (
              "def twilio_pjsip(trunk: str, public_ip: str, local_net: str) -> str:\n"
          )
          new_twilio_def = (
              "def twilio_security_global() -> str:\n"
              "    return (\n"
              "        \"\\n[global]\\n\"\n"
              "        \"type=global\\n\"\n"
              "        \"endpoint_identifier_order=ip\\n\"\n"
              "        \"unidentified_request_count=2\\n\"\n"
              "        \"unidentified_request_period=5\\n\"\n"
              "        \"unidentified_request_prune_interval=30\\n\"\n"
              "        \"disable_multi_domain=yes\\n\"\n"
              "        \"max_forwards=70\\n\"\n"
              "        \"user_agent=Floodman-Voice-Gateway\\n\"\n"
              "    )\n"
              "\n"
              "\n"
              "def twilio_pjsip(trunk: str, public_ip: str, local_net: str) -> str:\n"
          )
          replace_once(
              renderer,
              old_twilio_def,
              new_twilio_def,
              "Twilio PJSIP global security settings",
          )

          tq = '"' * 3
          twilio_return_anchor = (
              "    return transport + f"
              + tq
              + "\n\n[{trunk}]\ntype=endpoint\n"
          )
          twilio_return_replacement = (
              "    return twilio_security_global() + transport + f"
              + tq
              + "\n\n[{trunk}]\ntype=endpoint\n"
          )
          replace_once(
              renderer,
              twilio_return_anchor,
              twilio_return_replacement,
              "Twilio security global inclusion",
          )

          (root / "tests/test_ai_readiness_sip_security.py").write_text(
              r'''from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path


          def test_ava_waits_for_local_ai_before_starting(project_root: Path) -> None:
              script = (project_root / "scripts/run_ava.sh").read_text(encoding="utf-8")
              assert "LOCAL_AI_READY_TIMEOUT_SECONDS" in script
              assert "socket.create_connection" in script
              assert "Floodman local AI ready" in script
              assert script.index("socket.create_connection") < script.index(
                  'exec /opt/venv/bin/python "${AVA_RUNTIME_DIR}/main.py"'
              )


          def test_direct_gate_has_wall_clock_no_audio_fail_open(
              project_root: Path,
          ) -> None:
              source = (
                  project_root / "app/call_gate/audio_socket.py"
              ).read_text(encoding="utf-8")
              assert 'decision.metadata["no_audio_fail_open"] = True' in source
              assert "minimum_audio_seconds = max(0.35" in source
              assert "elapsed >= silence_timeout and not enough_audio" in source


          def test_twilio_renderer_uses_ip_only_endpoint_identification(
              project_root: Path,
              tmp_path: Path,
          ) -> None:
              env = os.environ.copy()
              env.update(
                  {
                      "DATA_DIR": str(tmp_path / "runtime"),
                      "ASTERISK_CONFIG_DIR": str(tmp_path / "runtime/asterisk/etc"),
                      "ASTERISK_MODULE_DIR": str(tmp_path / "modules"),
                      "SIP_TRUNK_MODE": "twilio",
                      "PUBLIC_IP": "203.0.113.10",
                      "LOCAL_NET": "172.16.0.0/12",
                      "TWILIO_TERMINATION_URI": "floodman-test.pstn.ashburn.twilio.com",
                      "TWILIO_SIP_USERNAME": "FloodmanTestUser",
                      "TWILIO_SIP_PASSWORD": "Floodman-Test-2026",
                      "TWILIO_FROM_NUMBER": "+12315550100",
                      "OUTBOUND_CALLER_ID_NUMBER": "+12315550100",
                      "ARI_SECRET": "ari-test-secret",
                      "AMI_SECRET": "ami-test-secret",
                  }
              )
              subprocess.run(
                  ["python", str(project_root / "scripts/render_asterisk.py")],
                  check=True,
                  env=env,
                  cwd=project_root,
              )
              pjsip = (
                  tmp_path / "runtime/asterisk/etc/pjsip.conf"
              ).read_text(encoding="utf-8")
              assert "[global]" in pjsip
              assert "endpoint_identifier_order=ip" in pjsip
              assert "user_agent=Floodman-Voice-Gateway" in pjsip
              assert "unidentified_request_count=2" in pjsip
              assert "match=54.172.60.0/30" in pjsip
              assert "anonymous" not in pjsip
          ''',
              encoding="utf-8",
              newline="\n",
          )
          PY_PATCH

      - name: Verify generated syntax
        shell: bash
        run: |
          python -m py_compile \
            app/call_gate/audio_socket.py \
            scripts/render_asterisk.py \
            tests/test_ai_readiness_sip_security.py
          bash -n scripts/run_ava.sh

      - name: Install project test dependencies
        run: pip install -e '.[dev]'

      - name: Run focused readiness and SIP tests
        run: python -m pytest tests/test_ai_readiness_sip_security.py -q

      - name: Run complete repository tests
        run: python -m pytest tests/ -x -q

      - name: Compile and validate repository
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          git diff --check

      - name: Commit tested repair
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/call_gate/audio_socket.py \
            scripts/run_ava.sh \
            scripts/render_asterisk.py \
            tests/test_ai_readiness_sip_security.py

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "AI readiness and SIP repair is already installed."
          else
            git commit -m "fix: gate calls promptly and wait for local AI readiness"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch container builds
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-container.yml --ref main

      - name: Summary
        run: |
          echo "### Floodman AI readiness and SIP repair" >> "$GITHUB_STEP_SUMMARY"
          echo "- Direct silent callers fail open on wall-clock time" >> "$GITHUB_STEP_SUMMARY"
          echo "- Google-hinted calls retain the long announcement-screening window" >> "$GITHUB_STEP_SUMMARY"
          echo "- AVA waits for the fully loaded local AI WebSocket before starting" >> "$GITHUB_STEP_SUMMARY"
          echo "- Twilio inbound endpoint identification is IP-only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scanner security events are aggregated and the SIP user agent is generic" >> "$GITHUB_STEP_SUMMARY"
