name: Build standalone Deckard CPU appliance

"on":
  push:
    branches: [codex/deckard-cpu-deploy]
    paths: ["appliance/**", ".github/workflows/deploy-deckard-cpu.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deckard-cpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appliance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: appliance/pyproject.toml
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: python -m py_compile app/*.py scripts/*.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and publish CPU image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./appliance
          file: ./appliance/Dockerfile.cpu
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:cpu-deckard-${{ github.sha }}
          cache-from: type=gha,scope=cpu-deckard
          cache-to: type=gha,mode=max,scope=cpu-deckard
          provenance: mode=max
      - name: Record immutable image
        run: echo '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
