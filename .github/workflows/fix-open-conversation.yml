name: Verify and build open conversation and patient closing
"on":
  push:
    branches: [codex/open-conversation]
    paths: ["appliance/**", ".github/workflows/fix-open-conversation.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appliance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: appliance/pyproject.toml
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build hotfix using the deployed speech runtime
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./appliance
          file: ./appliance/Dockerfile.open-conversation
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:cpu-open-conversation-${{ github.sha }}
      - name: Download speech-only test assets
        run: |
          docker volume create voices-conversation-models
          docker run --rm --mount type=volume,source=voices-conversation-models,target=/home/container/data --entrypoint /opt/venv/bin/python '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}' /opt/floodman/scripts/download_local_trial.py --speech-only --with-whisper
      - name: Verify actual local speech and contact capture
        run: >-
          docker run --rm --network none --read-only --cpus 4 --memory 6g
          --mount type=volume,source=voices-conversation-models,target=/home/container/data
          --entrypoint /opt/venv/bin/python '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}'
          /opt/floodman/scripts/benchmark_local_speech.py --contacts --strict
      - name: Verify real speech detector against noise, echo, and overlapping callers
        run: >-
          docker run --rm --network none --read-only --cpus 4 --memory 2g
          --mount type=volume,source=voices-conversation-models,target=/home/container/data
          --entrypoint /opt/venv/bin/python '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}'
          /opt/floodman/scripts/smoke_noise_interruptions.py
      - name: Verify natural email playback and closing with real local speech
        run: >-
          docker run --rm --network none --read-only --cpus 4 --memory 6g
          --mount type=volume,source=voices-conversation-models,target=/home/container/data
          --entrypoint /opt/venv/bin/python '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}'
          /opt/floodman/scripts/smoke_email_closing.py
      - name: Verify open conversation, story continuation, and grateful closing with real speech
        run: >-
          docker run --rm --network none --read-only --cpus 4 --memory 6g
          --mount type=volume,source=voices-conversation-models,target=/home/container/data
          --entrypoint /opt/venv/bin/python '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}'
          /opt/floodman/scripts/smoke_open_conversation.py
      - name: Verify Asterisk transfer handoff
        run: >-
          docker run --rm --network none --read-only --tmpfs /home/container/data:rw,uid=988,gid=988
          -e LOCAL_VOICE_STACK=standard --entrypoint /opt/venv/bin/python
          '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}'
          /opt/floodman/scripts/smoke_transfer_handoff.py
      - name: Record immutable image
        run: echo '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
