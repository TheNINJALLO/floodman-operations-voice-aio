name: Repair Floodman GPU Appliance Python Runtime

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-gpu-appliance-python-runtime.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: repair-floodman-gpu-python-runtime
  cancel-in-progress: false

jobs:
  repair:
    name: Rebuild gpu-appliance with the venv Python runtime
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out the appliance branch
        uses: actions/checkout@v4
        with:
          ref: self-hosted-gpu-appliance
          fetch-depth: 0

      - name: Set up test Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch the container Python runtime
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Verify generated source
        shell: bash
        run: |
          python -m py_compile appliance/app/*.py appliance/scripts/*.py appliance/tests/*.py
          bash -n appliance/scripts/*.sh
          grep -q 'VIRTUAL_ENV=/opt/venv' appliance/Dockerfile
          grep -q 'PATH=/opt/venv/bin:' appliance/Dockerfile
          grep -q 'PYTHON_BIN="${PYTHON_BIN:-${VIRTUAL_ENV}/bin/python}"' appliance/scripts/entrypoint.sh
          ! grep -Eq '^[[:space:]]*python[[:space:]]+/opt/floodman/' appliance/scripts/entrypoint.sh
          git diff --check

      - name: Install appliance test dependencies
        working-directory: appliance
        run: pip install -e '.[dev]'

      - name: Run complete appliance tests
        working-directory: appliance
        env:
          PYTHONPATH: ${{ github.workspace }}/appliance
        run: python -m pytest tests -q

      - name: Commit the tested repair
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appliance/Dockerfile appliance/scripts/entrypoint.sh appliance/tests/test_python_runtime_contract.py appliance/RELEASE_NOTES.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "fix: expose the appliance virtualenv Python runtime"
            git push origin HEAD:self-hosted-gpu-appliance
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image names
        id: image
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "candidate=${IMAGE}:gpu-appliance-candidate-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build the exact tested image locally
        uses: docker/build-push-action@v6
        with:
          context: ./appliance
          file: ./appliance/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.candidate }}
          cache-from: type=gha,scope=gpu-appliance
          cache-to: type=gha,mode=max,scope=gpu-appliance
          provenance: false

      - name: Smoke-test Python inside the image
        shell: bash
        env:
          CANDIDATE: ${{ steps.image.outputs.candidate }}
        run: |
          docker run --rm --entrypoint /bin/bash "${CANDIDATE}" -lc '
            set -euo pipefail
            test "$(command -v python)" = "/opt/venv/bin/python"
            python --version
            python -c "import app, yaml; print(\"Runtime imports: PASS\")"
            tmp_env="$(mktemp)"
            python /opt/floodman/scripts/envfile.py validate "${tmp_env}"
            set +e
            output="$(timeout 20 /opt/floodman/scripts/entrypoint.sh 2>&1)"
            status=$?
            set -e
            printf "%s\n" "${output}"
            grep -q "Floodman Python runtime:" <<< "${output}"
            ! grep -q "python: command not found" <<< "${output}"
            test "${status}" -ne 0
          '

      - name: Publish repaired image tags
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          CANDIDATE: ${{ steps.image.outputs.candidate }}
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          docker tag "${CANDIDATE}" "${IMAGE}:gpu-appliance"
          docker tag "${CANDIDATE}" "${IMAGE}:gpu-appliance-${SOURCE_SHA}"
          docker push "${IMAGE}:gpu-appliance"
          docker push "${IMAGE}:gpu-appliance-${SOURCE_SHA}"

      - name: Upload Pterodactyl egg
        uses: actions/upload-artifact@v4
        with:
          name: floodman-gpu-appliance-pterodactyl-egg
          path: appliance/pterodactyl/egg-floodman-voice-appliance.json
          if-no-files-found: error

      - name: Summary
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          echo "### Floodman GPU Python runtime repaired" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: ${SOURCE_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published :gpu-appliance" >> "$GITHUB_STEP_SUMMARY"
          echo "- Container smoke test confirmed /opt/venv/bin/python" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restart the fresh Pterodactyl server after this job is green" >> "$GITHUB_STEP_SUMMARY"
