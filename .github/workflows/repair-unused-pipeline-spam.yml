name: Repair Floodman Unused Pipeline Validation Spam

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-unused-pipeline-spam.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-unused-pipeline-spam
  cancel-in-progress: false

jobs:
  repair:
    name: Remove inactive legacy pipelines from the effective AVA config
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch profile-specific pipeline pruning
        shell: bash
        run: |
          python - <<'PY_PATCH'
          from pathlib import Path

          path = Path("scripts/apply_production_hybrid_ai.py")
          text = path.read_text(encoding="utf-8")

          old_production = (
              '        "pipelines": {\n'
              '            "floodman_production": {\n'
          )
          new_production = (
              '        "pipelines": {\n'
              '            # AVA upstream ships demo pipelines that Floodman does not use.\n'
              '            # Null values are deletion markers in AVA local overrides.\n'
              '            "local_hybrid": None,\n'
              '            "local_hybrid_groq": None,\n'
              '            "hybrid_elevenlabs": None,\n'
              '            "floodman_production": {\n'
          )
          if new_production not in text:
              if text.count(old_production) != 1:
                  raise SystemExit(
                      f"Expected one production pipeline anchor, found {text.count(old_production)}"
                  )
              text = text.replace(old_production, new_production, 1)

          old_local = (
              'def local_patch() -> dict[str, Any]:\n'
              '    return {\n'
              '        "default_provider": "${AVA_PROVIDER:-local_hybrid}",\n'
              '        "active_pipeline": "${AVA_PIPELINE:-local_hybrid}",\n'
              '    }\n'
          )
          new_local = (
              'def local_patch() -> dict[str, Any]:\n'
              '    return {\n'
              '        "default_provider": "${AVA_PROVIDER:-local_hybrid}",\n'
              '        "active_pipeline": "${AVA_PIPELINE:-local_hybrid}",\n'
              '        "pipelines": {\n'
              '            # Remove stale cloud and upstream demo pipelines on fallback.\n'
              '            "floodman_production": None,\n'
              '            "local_hybrid_groq": None,\n'
              '            "hybrid_elevenlabs": None,\n'
              '        },\n'
              '    }\n'
          )
          if new_local not in text:
              if text.count(old_local) != 1:
                  raise SystemExit(
                      f"Expected one local profile anchor, found {text.count(old_local)}"
                  )
              text = text.replace(old_local, new_local, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY_PATCH

      - name: Add regression tests
        shell: bash
        run: |
          cat > tests/test_profile_pipeline_pruning.py <<'PY_TEST'
          from __future__ import annotations

          import importlib.util
          import sys
          from pathlib import Path


          def load_profile_module(project_root: Path):
              path = project_root / "scripts/apply_production_hybrid_ai.py"
              spec = importlib.util.spec_from_file_location(
                  "floodman_profile_pipeline_pruning", path
              )
              assert spec and spec.loader
              module = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = module
              spec.loader.exec_module(module)
              return module


          def merge_with_null_deletion(base: dict, override: dict) -> dict:
              merged = dict(base)
              for key, value in override.items():
                  if value is None:
                      merged.pop(key, None)
                  elif isinstance(value, dict) and isinstance(merged.get(key), dict):
                      merged[key] = merge_with_null_deletion(merged[key], value)
                  else:
                      merged[key] = value
              return merged


          def upstream_demo_pipelines() -> dict:
              return {
                  "local_hybrid": {"stt": "local_stt", "tts": "local_tts"},
                  "local_hybrid_groq": {
                      "stt": "local_stt",
                      "llm": "groq_llm",
                      "tts": "local_tts",
                  },
                  "hybrid_elevenlabs": {
                      "stt": "local_stt",
                      "llm": "openai_llm",
                      "tts": "elevenlabs_tts",
                  },
              }


          def test_production_profile_keeps_only_floodman_production(
              project_root: Path,
          ) -> None:
              module = load_profile_module(project_root)
              patch = module.production_patch()
              pipeline_patch = patch["pipelines"]
              assert pipeline_patch["local_hybrid"] is None
              assert pipeline_patch["local_hybrid_groq"] is None
              assert pipeline_patch["hybrid_elevenlabs"] is None

              merged = merge_with_null_deletion(
                  {"pipelines": upstream_demo_pipelines()}, patch
              )
              assert set(merged["pipelines"]) == {"floodman_production"}


          def test_local_profile_removes_stale_cloud_and_demo_pipelines(
              project_root: Path,
          ) -> None:
              module = load_profile_module(project_root)
              patch = module.local_patch()
              pipeline_patch = patch["pipelines"]
              assert pipeline_patch["floodman_production"] is None
              assert pipeline_patch["local_hybrid_groq"] is None
              assert pipeline_patch["hybrid_elevenlabs"] is None

              base = upstream_demo_pipelines()
              base["floodman_production"] = {
                  "stt": "deepgram_flux_stt",
                  "llm": "groq_llm",
                  "tts": "elevenlabs_tts",
              }
              merged = merge_with_null_deletion({"pipelines": base}, patch)
              assert set(merged["pipelines"]) == {"local_hybrid"}
          PY_TEST

      - name: Verify generated syntax
        run: |
          python -m py_compile \
            scripts/apply_production_hybrid_ai.py \
            tests/test_profile_pipeline_pruning.py
          git diff --check

      - name: Install project test dependencies
        run: pip install -e '.[dev]'

      - name: Run focused pipeline-pruning tests
        run: python -m pytest tests/test_profile_pipeline_pruning.py -q

      - name: Run complete repository tests
        run: python -m pytest tests/ -x -q

      - name: Compile and validate repository
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          git diff --check

      - name: Commit tested repair
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/apply_production_hybrid_ai.py \
            tests/test_profile_pipeline_pruning.py

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Unused-pipeline repair is already installed."
          else
            git commit -m "fix: remove inactive AVA pipelines from profile validation"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch full and lite container builds
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-container.yml --ref main

      - name: Summary
        run: |
          echo "### Floodman unused-pipeline validation repair" >> "$GITHUB_STEP_SUMMARY"
          echo "- production_hybrid now exposes only floodman_production" >> "$GITHUB_STEP_SUMMARY"
          echo "- local_hybrid removes stale production and upstream demo pipelines" >> "$GITHUB_STEP_SUMMARY"
          echo "- local_hybrid_groq no longer hammers 127.0.0.1:8765 while local AI is intentionally off" >> "$GITHUB_STEP_SUMMARY"
          echo "- The full repository test suite passed before commit" >> "$GITHUB_STEP_SUMMARY"
