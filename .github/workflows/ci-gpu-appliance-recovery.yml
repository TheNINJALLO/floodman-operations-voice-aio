name: Build GPU Appliance Recovery Candidate

"on":
  push:
    branches:
      - codex/telephony-recovery
    paths:
      - appliance/**
      - .github/workflows/ci-gpu-appliance-recovery.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gpu-appliance-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test recovery source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appliance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: appliance/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: python -m py_compile app/*.py scripts/*.py

  build:
    name: Publish immutable recovery candidate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and publish candidate
        uses: docker/build-push-action@v6
        with:
          context: ./appliance
          file: ./appliance/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:gpu-appliance-candidate-${{ github.sha }}
          cache-from: type=gha,scope=gpu-appliance
          cache-to: type=gha,mode=max,scope=gpu-appliance
          provenance: mode=max
