name: Build GPU Appliance Recovery Candidate

"on":
  push:
    branches:
      - codex/telephony-recovery
    tags:
      - "gpu-appliance-promote-*"
      - "gpu-appliance-rollback-*"
    paths:
      - appliance/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gpu-appliance-recovery-production
  cancel-in-progress: false

jobs:
  test:
    name: Test recovery source
    if: ${{ !startsWith(github.ref, 'refs/tags/gpu-appliance-rollback-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appliance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: appliance/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: python -m py_compile app/*.py scripts/*.py

  build:
    name: Publish immutable recovery candidate
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/gpu-appliance-promote-') && !startsWith(github.ref, 'refs/tags/gpu-appliance-rollback-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and publish candidate
        uses: docker/build-push-action@v6
        with:
          context: ./appliance
          file: ./appliance/unified/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:gpu-appliance-candidate-${{ github.sha }}
          cache-from: type=gha,scope=gpu-appliance
          cache-to: type=gha,mode=max,scope=gpu-appliance
          provenance: mode=max

  promote:
    name: Promote tested candidate to production
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/gpu-appliance-promote-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image and candidate
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          candidate_sha="${GITHUB_REF_NAME#gpu-appliance-promote-}"
          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Promotion tag must end with a full 40-character lowercase commit SHA." >&2
            exit 1
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
      - name: Verify immutable candidate exists
        run: docker buildx imagetools inspect "$IMAGE:gpu-appliance-candidate-$CANDIDATE_SHA"
      - name: Promote candidate
        run: docker buildx imagetools create --tag "$IMAGE:gpu-appliance" "$IMAGE:gpu-appliance-candidate-$CANDIDATE_SHA"
      - name: Verify production tag
        run: docker buildx imagetools inspect "$IMAGE:gpu-appliance"

  rollback:
    name: Restore production digest
    if: ${{ startsWith(github.ref, 'refs/tags/gpu-appliance-rollback-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image and rollback digest
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          rollback_digest="${GITHUB_REF_NAME#gpu-appliance-rollback-}"
          if [[ ! "$rollback_digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Rollback tag must end with a full 64-character lowercase SHA-256 digest." >&2
            exit 1
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "ROLLBACK_DIGEST=$rollback_digest" >> "$GITHUB_ENV"
      - name: Verify rollback image exists
        run: docker buildx imagetools inspect "$IMAGE@sha256:$ROLLBACK_DIGEST"
      - name: Restore production tag
        run: docker buildx imagetools create --tag "$IMAGE:gpu-appliance" "$IMAGE@sha256:$ROLLBACK_DIGEST"
      - name: Verify production tag
        run: docker buildx imagetools inspect "$IMAGE:gpu-appliance"
