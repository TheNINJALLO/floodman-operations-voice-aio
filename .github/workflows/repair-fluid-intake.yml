name: Repair Floodman Fluid Intake Handoff v2

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-fluid-intake.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-fluid-intake-v2
  cancel-in-progress: false

jobs:
  repair:
    name: Remove service-label pauses and continue the intake
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install patch dependencies
        run: python -m pip install "PyYAML>=6.0,<7"

      - name: Apply silent classification and direct continuation
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/repair_fluid_intake.py
          python /tmp/repair_fluid_intake.py
          rm -f /tmp/repair_fluid_intake.py

      - name: Verify generated syntax and configuration
        shell: bash
        run: |
          python -m py_compile \
            app/business/service.py \
            app/intake_flow.py \
            app/ava/agents.py \
            tests/test_fluid_intake.py \
            tests/test_intake_continuation.py \
            tests/test_complete_intake_transcripts.py
          python - <<'PY_VERIFY'
          import yaml
          from pathlib import Path

          config = yaml.safe_load(
              Path("config/ava/ai-agent.local.yaml").read_text(
                  encoding="utf-8"
              )
          )
          tools = config["in_call_tools"]
          assert "floodman_classify_service" not in tools

          capture = tools["floodman_capture_intake_progress"]
          assert "{service_key}" not in capture["body_template"]
          assert "{service_status}" not in capture["body_template"]
          assert "{service_reason}" not in capture["body_template"]

          names = {
              parameter["name"]
              for parameter in capture["parameters"]
          }
          assert "service_key" not in names
          assert "service_status" not in names
          assert "service_reason" not in names
          assert "exactly one" in capture["description"].lower()
          PY_VERIFY
          git diff --check

      - name: Install project test dependencies
        run: pip install -e '.[dev]'

      - name: Run fluid-intake regression tests
        run: |
          python -m pytest \
            tests/test_fluid_intake.py \
            tests/test_intake_continuation.py \
            tests/test_single_field_intake_flow.py \
            tests/test_complete_intake_transcripts.py \
            -q

      - name: Run full repository tests
        run: python -m pytest tests/ -x -q

      - name: Compile and validate repository
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          git diff --check

      - name: Commit and push tested fluid-intake repair
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/business/service.py \
            app/intake_flow.py \
            app/ava/agents.py \
            config/ava/ai-agent.local.yaml \
            tests/test_fluid_intake.py \
            tests/test_intake_continuation.py \
            tests/test_complete_intake_transcripts.py

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Fluid intake repair is already installed."
          else
            git commit -m "fix: classify silently and continue intake"
            NEW_SHA="$(git rev-parse HEAD)"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=${NEW_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait until GitHub exposes the exact new main SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          REMOTE_SHA=""
          for attempt in $(seq 1 40); do
            REMOTE_SHA="$(
              git ls-remote origin refs/heads/main |
              awk '{print $1}'
            )"
            echo "main=${REMOTE_SHA} expected=${EXPECTED_SHA}"
            if [[ "${REMOTE_SHA}" == "${EXPECTED_SHA}" ]]; then
              exit 0
            fi
            sleep 3
          done

          echo "GitHub main did not reach the new source SHA."
          exit 1

      - name: Dispatch container build for the exact source commit
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          sleep 8
          gh workflow run ci-container.yml --ref main

          RUN_ID=""
          for attempt in $(seq 1 40); do
            RUN_ID="$(
              gh run list \
                --workflow ci-container.yml \
                --branch main \
                --event workflow_dispatch \
                --limit 30 \
                --json databaseId,headSha,createdAt |
              jq -r --arg sha "${EXPECTED_SHA}" \
                '.[] | select(.headSha == $sha) | .databaseId' |
              head -n 1
            )"

            if [[ -n "${RUN_ID}" ]]; then
              echo "Found container run ${RUN_ID} for ${EXPECTED_SHA}"
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done

          echo "No container workflow run targeted ${EXPECTED_SHA}."
          exit 1

      - name: Wait for full and lite images to publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          gh run watch "${RUN_ID}" --exit-status --interval 10

      - name: Summary
        run: |
          echo "### Floodman fluid intake handoff" >> "$GITHUB_STEP_SUMMARY"
          echo "- Removed the separate AI service-classification turn" >> "$GITHUB_STEP_SUMMARY"
          echo "- Classification now happens silently inside intake capture" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service names and internal categories are hidden from Ava" >> "$GITHUB_STEP_SUMMARY"
          echo "- Supported calls move directly to the next normal question" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unsupported calls receive one generic notice, then continue" >> "$GITHUB_STEP_SUMMARY"
          echo "- Completed intake submits inside capture without another spoken pause" >> "$GITHUB_STEP_SUMMARY"
          echo "- This workflow stays active until the exact-SHA container build finishes" >> "$GITHUB_STEP_SUMMARY"
