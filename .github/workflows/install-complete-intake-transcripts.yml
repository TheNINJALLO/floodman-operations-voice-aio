name: Install Complete Floodman Intake and Transcript Recovery

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/install-complete-intake-transcripts.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-complete-intake-transcripts
  cancel-in-progress: false

jobs:
  install:
    name: Restore detailed intake, partial-call alerts, and web transcripts
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install patch dependencies
        run: python -m pip install "PyYAML>=6.0,<7"

      - name: Apply complete intake and transcript recovery
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/install_complete_intake_transcripts.py
          python /tmp/install_complete_intake_transcripts.py
          rm -f /tmp/install_complete_intake_transcripts.py

      - name: Verify generated source and web syntax
        shell: bash
        run: |
          python -m py_compile \
            app/intake.py \
            app/db.py \
            app/business/service.py \
            app/main.py \
            app/notifications.py \
            app/ava/agents.py \
            scripts/sync_fast_intake_runtime.py \
            scripts/patch_ava_optional_params.py \
            scripts/patch_ava_groq_model_fallback.py \
            tests/test_complete_intake_transcripts.py \
            tests/test_fast_intake_live_runtime.py
          node --check web/app.js
          bash -n scripts/entrypoint.sh
          git diff --check

      - name: Validate complete AVA patch chain against pinned upstream
        shell: bash
        run: |
          rm -rf /tmp/floodman-ava-complete-intake-test
          git init /tmp/floodman-ava-complete-intake-test
          git -C /tmp/floodman-ava-complete-intake-test remote add origin \
            https://github.com/hkjarral/AVA-AI-Voice-Agent-for-Asterisk.git
          git -C /tmp/floodman-ava-complete-intake-test fetch --depth 1 origin \
            18d4e769335f3b643aca80e084c7e66f0969491e
          git -C /tmp/floodman-ava-complete-intake-test checkout --detach FETCH_HEAD

          python scripts/patch_ava.py \
            --ava-root /tmp/floodman-ava-complete-intake-test
          python scripts/patch_ava_optional_params.py \
            --ava-root /tmp/floodman-ava-complete-intake-test
          python scripts/patch_ava_production.py \
            --ava-root /tmp/floodman-ava-complete-intake-test
          python scripts/patch_ava_groq_resilience.py \
            --ava-root /tmp/floodman-ava-complete-intake-test
          python scripts/patch_ava_groq_model_fallback.py \
            --ava-root /tmp/floodman-ava-complete-intake-test
          python scripts/patch_ava_flux.py \
            --ava-root /tmp/floodman-ava-complete-intake-test

          python -m py_compile \
            /tmp/floodman-ava-complete-intake-test/src/tools/http/in_call_lookup.py \
            /tmp/floodman-ava-complete-intake-test/src/pipelines/openai.py \
            /tmp/floodman-ava-complete-intake-test/src/pipelines/deepgram_flux.py
          grep -q "Floodman JSON body safety patch" \
            /tmp/floodman-ava-complete-intake-test/src/tools/http/in_call_lookup.py
          grep -q "Floodman optional HTTP tool parameters patch" \
            /tmp/floodman-ava-complete-intake-test/src/tools/http/in_call_lookup.py
          grep -q "Floodman Groq model fallback patch" \
            /tmp/floodman-ava-complete-intake-test/src/pipelines/openai.py
          grep -q "switching to fallback model" \
            /tmp/floodman-ava-complete-intake-test/src/pipelines/openai.py

      - name: Install project test dependencies
        run: pip install -e '.[dev]'

      - name: Run complete-intake regression tests
        shell: bash
        run: |
          python -m pytest \
            tests/test_complete_intake_transcripts.py \
            tests/test_fast_intake_team_sms.py \
            tests/test_fast_intake_live_runtime.py \
            -q

      - name: Run full repository tests
        run: python -m pytest tests/ -x -q

      - name: Compile and validate repository
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          node --check web/app.js
          python scripts/validate_configs.py
          git diff --check

      - name: Commit tested complete-intake upgrade
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Dockerfile \
            app/ava/agents.py \
            app/business/service.py \
            app/db.py \
            app/intake.py \
            app/main.py \
            app/notifications.py \
            config/ava/ai-agent.local.yaml \
            docs/COMPLETE_INTAKE_AND_TRANSCRIPTS.md \
            scripts/apply_production_hybrid_ai.py \
            scripts/entrypoint.sh \
            scripts/patch_ava_optional_params.py \
            scripts/patch_ava_groq_model_fallback.py \
            scripts/sync_fast_intake_runtime.py \
            tests/test_complete_intake_transcripts.py \
            tests/test_fast_intake_live_runtime.py \
            web/app.js \
            web/index.html \
            web/styles.css

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Complete intake and transcript recovery is already installed."
          else
            git commit -m "feat: restore complete voice intake and transcripts"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch full and lite container builds
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-container.yml --ref main

      - name: Installation summary
        run: |
          echo "### Complete Floodman intake and transcript recovery" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restores the detailed issue interview and service-specific questions" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requires name, callback number, full address, and email or explicit email disposition" >> "$GITHUB_STEP_SUMMARY"
          echo "- Saves progress after every substantive caller answer" >> "$GITHUB_STEP_SUMMARY"
          echo "- Clearly identifies unsupported services while still forwarding the request" >> "$GITHUB_STEP_SUMMARY"
          echo "- Queues one team SMS for complete, unsupported, review, hangup, no-input, provider-failure, and immediate-hangup calls" >> "$GITHUB_STEP_SUMMARY"
          echo "- Adds Calls & Intake history with full transcripts to the web app" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preserves the Groq fallback, persistent AVA sync, and Asterisk audio-path repairs" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dispatches both full and lite container builds after every test passes" >> "$GITHUB_STEP_SUMMARY"
