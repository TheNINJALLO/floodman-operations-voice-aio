name: Repair Floodman Conversation Stability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-conversation-stability.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-conversation-stability
  cancel-in-progress: false

jobs:
  repair:
    name: Add Groq 429 backoff and disable unstable pipeline TalkDetect
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conversation stability repair files
        shell: bash
        run: |
          printf '%s' '' | base64 -d > scripts/patch_ava_groq_resilience.py
          printf '%s' '' | base64 -d > /tmp/apply_conversation_stability.py
          printf '%s' '' | base64 -d > tests/test_conversation_stability.py
          chmod +x scripts/patch_ava_groq_resilience.py
          python /tmp/apply_conversation_stability.py

      - name: Verify patch against the pinned AVA source
        shell: bash
        run: |
          rm -rf /tmp/floodman-ava-patch-test
          git init /tmp/floodman-ava-patch-test
          git -C /tmp/floodman-ava-patch-test remote add origin \
            https://github.com/hkjarral/AVA-AI-Voice-Agent-for-Asterisk.git
          git -C /tmp/floodman-ava-patch-test fetch --depth 1 origin \
            18d4e769335f3b643aca80e084c7e66f0969491e
          git -C /tmp/floodman-ava-patch-test checkout --detach FETCH_HEAD
          python scripts/patch_ava_production.py \
            --ava-root /tmp/floodman-ava-patch-test
          python scripts/patch_ava_groq_resilience.py \
            --ava-root /tmp/floodman-ava-patch-test
          python -m py_compile \
            /tmp/floodman-ava-patch-test/src/pipelines/openai.py
          grep -q "Floodman Groq 429 backoff patch" \
            /tmp/floodman-ava-patch-test/src/pipelines/openai.py
          grep -q "waiting before streaming retry" \
            /tmp/floodman-ava-patch-test/src/pipelines/openai.py
          grep -q "waiting before serial retry" \
            /tmp/floodman-ava-patch-test/src/pipelines/openai.py

      - name: Verify generated syntax
        shell: bash
        run: |
          python -m py_compile \
            scripts/patch_ava_groq_resilience.py \
            scripts/apply_production_hybrid_ai.py \
            tests/test_conversation_stability.py
          git diff --check

      - name: Install project test dependencies
        run: pip install -e '.[dev]'

      - name: Run focused stability tests
        run: python -m pytest tests/test_conversation_stability.py -q

      - name: Run complete repository tests
        run: python -m pytest tests/ -x -q

      - name: Compile and validate repository
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          git diff --check

      - name: Commit tested stability repair
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Dockerfile \
            scripts/patch_ava_groq_resilience.py \
            scripts/apply_production_hybrid_ai.py \
            tests/test_conversation_stability.py \
            .env.twilio.example

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Conversation stability repair is already installed."
          else
            git commit -m "fix: preserve calls through Groq limits and stale barge-in"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch full and lite container builds
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-container.yml --ref main

      - name: Summary
        run: |
          echo "### Floodman conversation stability repair" >> "$GITHUB_STEP_SUMMARY"
          echo "- Groq 429 responses honor retry/reset timing instead of dropping the caller turn" >> "$GITHUB_STEP_SUMMARY"
          echo "- Streaming retries remain inside the same caller turn" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production TALK_DETECT is disabled to prevent stale post-TTS disconnects" >> "$GITHUB_STEP_SUMMARY"
          echo "- Groq service tier defaults to on_demand" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full and lite image builds were dispatched after all tests" >> "$GITHUB_STEP_SUMMARY"
