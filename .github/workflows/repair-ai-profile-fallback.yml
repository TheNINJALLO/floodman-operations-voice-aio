name: Repair Floodman AI Profile Fallback v2

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-ai-profile-fallback.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-ai-profile-fallback
  cancel-in-progress: false

jobs:
  repair:
    name: Restore local_hybrid after a cloud-to-local transition v2
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check             "PyYAML>=6.0,<7"
          python - <<'PY_DEPENDENCY'
          import yaml
          print(f"PyYAML ready: {yaml.__version__}")
          PY_DEPENDENCY

      - name: Apply AI profile fallback repair
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/install_ai_profile_fallback.py
          python /tmp/install_ai_profile_fallback.py
          rm -f /tmp/install_ai_profile_fallback.py

      - name: Verify generated source
        shell: bash
        run: |
          python -m py_compile \
            scripts/apply_production_hybrid_ai.py \
            tests/test_ai_profile_fallback_recovery.py \
            tests/test_profile_pipeline_pruning.py

          python - <<'PY_VERIFY'
          import importlib.util
          import sys
          from pathlib import Path

          path = Path("scripts/apply_production_hybrid_ai.py")
          spec = importlib.util.spec_from_file_location(
              "profile_fallback_preflight",
              path,
          )
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          patch = module.local_patch()
          assert patch["pipelines"]["local_hybrid"] == {
              "llm": "local_llm",
          }
          assert patch["providers"]["local_llm"]["enabled"] is True
          assert patch["pipelines"]["floodman_production"] is None
          assert hasattr(module, "validate_selected_profile")
          PY_VERIFY

          git diff --check

      - name: Simulate persistent production-to-local recovery
        shell: bash
        run: |
          TMP_DIR="$(mktemp -d)"
          cp config/ava/ai-agent.local.yaml \
            "${TMP_DIR}/ai-agent.local.yaml"

          python scripts/apply_production_hybrid_ai.py \
            --profile production_hybrid \
            --config "${TMP_DIR}/ai-agent.local.yaml"

          python - "${TMP_DIR}/ai-agent.local.yaml" <<'PY_PRODUCTION'
          from pathlib import Path
          import sys
          import yaml

          path = Path(sys.argv[1])
          config = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert config["pipelines"]["local_hybrid"] is None
          assert isinstance(
              config["pipelines"]["floodman_production"],
              dict,
          )
          PY_PRODUCTION

          python scripts/apply_production_hybrid_ai.py \
            --profile local_hybrid \
            --config "${TMP_DIR}/ai-agent.local.yaml"

          python - "${TMP_DIR}/ai-agent.local.yaml" <<'PY_LOCAL'
          from pathlib import Path
          import sys
          import yaml

          path = Path(sys.argv[1])
          config = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert config["default_provider"] == (
              "${AVA_PROVIDER:-local_hybrid}"
          )
          assert config["active_pipeline"] == (
              "${AVA_PIPELINE:-local_hybrid}"
          )
          assert config["pipelines"]["local_hybrid"] == {
              "llm": "local_llm",
          }
          assert config["pipelines"]["floodman_production"] is None
          assert config["providers"]["local_llm"]["enabled"] is True
          PY_LOCAL

          rm -rf "${TMP_DIR}"

      - name: Install project test dependencies
        run: pip install -e '.[dev]'

      - name: Run focused profile-transition tests
        run: |
          python -m pytest \
            tests/test_ai_profile_fallback_recovery.py \
            tests/test_profile_pipeline_pruning.py \
            tests/test_production_hybrid_ai.py \
            tests/test_runtime_engine_startup.py \
            -q

      - name: Run complete repository tests
        run: python -m pytest tests/ -q

      - name: Compile and validate repository
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          git diff --check

      - name: Commit tested fallback repair
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/apply_production_hybrid_ai.py \
            tests/test_ai_profile_fallback_recovery.py \
            tests/test_profile_pipeline_pruning.py

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "fix: restore local AI pipeline after cloud fallback"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for main to expose the exact source SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          for attempt in $(seq 1 40); do
            REMOTE_SHA="$(
              git ls-remote origin refs/heads/main |
              awk '{print $1}'
            )"
            if [[ "${REMOTE_SHA}" == "${EXPECTED_SHA}" ]]; then
              echo "GitHub main is at ${EXPECTED_SHA}"
              exit 0
            fi
            sleep 3
          done
          echo "GitHub main did not expose ${EXPECTED_SHA} in time."
          exit 1

      - name: Resolve or dispatch exact-SHA container build
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          SUCCESS_RUN_ID="$(
            gh run list \
              --workflow ci-container.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,headSha,status,conclusion |
            jq -r --arg sha "${EXPECTED_SHA}" '
              [
                .[]
                | select(
                    .headSha == $sha
                    and .status == "completed"
                    and .conclusion == "success"
                  )
              ]
              | sort_by(.databaseId)
              | last
              | .databaseId // empty
            '
          )"

          if [[ -n "${SUCCESS_RUN_ID}" ]]; then
            echo "run_id=${SUCCESS_RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci-container.yml --ref main

          for attempt in $(seq 1 40); do
            RUN_ID="$(
              gh run list \
                --workflow ci-container.yml \
                --branch main \
                --event workflow_dispatch \
                --limit 50 \
                --json databaseId,headSha,createdAt |
              jq -r \
                --arg sha "${EXPECTED_SHA}" \
                --arg dispatched "${DISPATCHED_AT}" '
                  [
                    .[]
                    | select(
                        .headSha == $sha
                        and .createdAt >= $dispatched
                      )
                  ]
                  | sort_by(.databaseId)
                  | last
                  | .databaseId // empty
                '
            )"
            if [[ -n "${RUN_ID}" ]]; then
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done

          echo "No newly dispatched container build targeted ${EXPECTED_SHA}."
          exit 1

      - name: Wait for full and lite images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          RUN_SHA="$(gh run view "${RUN_ID}" --json headSha --jq '.headSha')"
          if [[ "${RUN_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Run ${RUN_ID} targets ${RUN_SHA}; expected ${EXPECTED_SHA}."
            exit 1
          fi

          STATUS="$(gh run view "${RUN_ID}" --json status --jq '.status')"
          if [[ "${STATUS}" == "completed" ]]; then
            CONCLUSION="$(
              gh run view "${RUN_ID}" --json conclusion --jq '.conclusion'
            )"
            if [[ "${CONCLUSION}" != "success" ]]; then
              echo "Container run ${RUN_ID} completed with ${CONCLUSION}."
              exit 1
            fi
            exit 0
          fi

          gh run watch "${RUN_ID}" --exit-status --interval 10

      - name: Summary
        run: |
          echo "### Floodman AI profile fallback repaired" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recreates local_hybrid after production previously deleted it" >> "$GITHUB_STEP_SUMMARY"
          echo "- Installs PyYAML before importing the profile renderer" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restores the local_llm provider contract" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validates the selected pipeline before writing runtime YAML" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests production-to-local transitions and stale persistent configs" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publishes full and lite images from the exact tested SHA" >> "$GITHUB_STEP_SUMMARY"
