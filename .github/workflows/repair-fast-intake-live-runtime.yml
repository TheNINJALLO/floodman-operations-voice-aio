name: Repair Floodman Fast Intake Live Runtime

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-fast-intake-live-runtime.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-fast-intake-live-runtime
  cancel-in-progress: false

jobs:
  repair:
    name: Fix address-turn rate limits, stale tools, and silent hangups
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install patch dependencies
        run: python -m pip install "PyYAML>=6.0,<7"

      - name: Apply live-call runtime repair
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/repair_fast_intake_live_runtime.py
          python /tmp/repair_fast_intake_live_runtime.py
          rm -f /tmp/repair_fast_intake_live_runtime.py

      - name: Verify generated syntax
        shell: bash
        run: |
          python -m py_compile \
            scripts/sync_fast_intake_runtime.py \
            scripts/patch_ava_groq_model_fallback.py \
            scripts/apply_production_hybrid_ai.py \
            tests/test_fast_intake_live_runtime.py
          bash -n scripts/entrypoint.sh
          git diff --check

      - name: Validate patches against pinned AVA source
        shell: bash
        run: |
          rm -rf /tmp/floodman-ava-live-runtime-test
          git init /tmp/floodman-ava-live-runtime-test
          git -C /tmp/floodman-ava-live-runtime-test remote add origin \
            https://github.com/hkjarral/AVA-AI-Voice-Agent-for-Asterisk.git
          git -C /tmp/floodman-ava-live-runtime-test fetch --depth 1 origin \
            18d4e769335f3b643aca80e084c7e66f0969491e
          git -C /tmp/floodman-ava-live-runtime-test checkout --detach FETCH_HEAD

          python scripts/patch_ava.py \
            --ava-root /tmp/floodman-ava-live-runtime-test
          python scripts/patch_ava_production.py \
            --ava-root /tmp/floodman-ava-live-runtime-test
          python scripts/patch_ava_groq_resilience.py \
            --ava-root /tmp/floodman-ava-live-runtime-test
          python scripts/patch_ava_groq_model_fallback.py \
            --ava-root /tmp/floodman-ava-live-runtime-test
          python scripts/patch_ava_flux.py \
            --ava-root /tmp/floodman-ava-live-runtime-test

          python -m py_compile \
            /tmp/floodman-ava-live-runtime-test/src/pipelines/openai.py \
            /tmp/floodman-ava-live-runtime-test/src/pipelines/deepgram_flux.py
          grep -q "Floodman Groq model fallback patch" \
            /tmp/floodman-ava-live-runtime-test/src/pipelines/openai.py
          grep -q "switching to fallback model" \
            /tmp/floodman-ava-live-runtime-test/src/pipelines/openai.py

      - name: Install project test dependencies
        run: pip install -e '.[dev]'

      - name: Run focused live-runtime tests
        run: python -m pytest tests/test_fast_intake_live_runtime.py -q

      - name: Run complete repository tests
        run: python -m pytest tests/ -x -q

      - name: Compile and validate repository
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          git diff --check

      - name: Commit tested live-runtime repair
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Dockerfile \
            scripts/entrypoint.sh \
            scripts/apply_production_hybrid_ai.py \
            scripts/sync_fast_intake_runtime.py \
            scripts/patch_ava_groq_model_fallback.py \
            tests/test_fast_intake_live_runtime.py

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fast-intake live-runtime repair is already installed."
          else
            git commit -m "fix: stabilize fast intake after address capture"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch full and lite container builds
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-container.yml --ref main

      - name: Summary
        run: |
          echo "### Floodman fast-intake live-runtime repair" >> "$GITHUB_STEP_SUMMARY"
          echo "- Synchronizes managed AVA tools into persistent runtime config" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restores floodman_submit_intake and disables booking tools" >> "$GITHUB_STEP_SUMMARY"
          echo "- Falls back to Llama 3.3 70B when Qwen is rate-limited" >> "$GITHUB_STEP_SUMMARY"
          echo "- Writes fallback prompts into Asterisk's sounds directory" >> "$GITHUB_STEP_SUMMARY"
          echo "- Extends inactivity timing for one provider failover" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dispatches full and lite images after all tests pass" >> "$GITHUB_STEP_SUMMARY"
