name: Install Floodman Website Knowledge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-floodman-website-knowledge.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-website-knowledge-install
  cancel-in-progress: false

jobs:
  install:
    name: Install and validate website knowledge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unpack reviewed Floodman website knowledge payload
        shell: bash
        run: |
          python - <<'PY_PAYLOAD'
          import base64
          import io
          import tarfile
          from pathlib import Path

          encoded = ""
          data = base64.b64decode(encoded, validate=True)
          root = Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
              members = archive.getmembers()
              for member in members:
                  target = (root / member.name).resolve(strict=False)
                  if target != root and root not in target.parents:
                      raise SystemExit(f"unsafe payload path: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"links are not allowed in payload: {member.name}")
              archive.extractall(root, members=members, filter="data")
          print(f"Installed {len(members)} reviewed payload files")
          PY_PAYLOAD
          chmod +x scripts/apply_website_knowledge_patch.py             scripts/install_knowledge_pack.py scripts/validate_configs.py

      - name: Wire knowledge search into Floodman and AVA
        run: python scripts/apply_website_knowledge_patch.py --root .

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Run complete validation
        shell: bash
        run: |
          python -m pytest tests/ -x -q
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          python - <<'PY_VALIDATE'
          from pathlib import Path
          import yaml
          from app.knowledge import KnowledgeBase, resolve_service_area

          config = yaml.safe_load(Path("config/floodman.yaml").read_text(encoding="utf-8"))
          assert len(config["business"]["service_area"]["cities"]) == 148
          knowledge = KnowledgeBase(Path("knowledge"))
          status = knowledge.status()
          assert status["approved_documents"] >= 10, status
          result = knowledge.search("What does Floodman do after a burst pipe and hidden moisture?")
          assert result["found"] and result["results"][0]["category"] == "water_damage", result
          area = resolve_service_area(config["business"]["service_area"], city="Grand Rapids")
          assert area["eligible"] is True
          unknown = resolve_service_area(config["business"]["service_area"], city="Detroit")
          assert unknown["eligible"] is None and unknown["requires_manual_confirmation"] is True
          print(status)
          PY_VALIDATE

      - name: Scan changed files for obvious secrets
        shell: bash
        run: |
          if git diff -- . ':!.github/workflows/install-floodman-website-knowledge.yml' |             grep -E '(^|[^A-Z])(AC|SK)[0-9a-fA-F]{32}|TWILIO_AUTH_TOKEN=[^[:space:]]+|ADMIN_TOKEN=[A-Za-z0-9_-]{20,}'; then
            echo 'Potential secret detected in generated changes.' >&2
            exit 1
          fi

      - name: Commit tested knowledge implementation
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             README.md             app/config.py app/main.py app/knowledge.py app/ava/agents.py             config/floodman.yaml config/ava/ai-agent.local.yaml             knowledge docs/KNOWLEDGE_LIBRARY.md docs/WEBSITE_CONTENT_AUDIT.md             scripts/apply_website_knowledge_patch.py scripts/install_knowledge_pack.py             scripts/validate_configs.py tests/test_knowledge.py
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Knowledge implementation already matches the reviewed payload."
          else
            git commit -m "feat: add Floodman website knowledge library"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch full and lite container builds
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-container.yml --ref main

      - name: Completion summary
        run: |
          echo "### Floodman website knowledge installed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Structured company profile with 148 published communities" >> "$GITHUB_STEP_SUMMARY"
          echo "- 10 approved detailed knowledge documents" >> "$GITHUB_STEP_SUMMARY"
          echo "- Local approved-only search tool wired into AVA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Persistent managed/custom knowledge migration with backups" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full repository tests and configuration validation passed" >> "$GITHUB_STEP_SUMMARY"
