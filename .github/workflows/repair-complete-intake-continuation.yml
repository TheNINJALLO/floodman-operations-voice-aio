name: Repair Complete Intake Continuation

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-complete-intake-continuation.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-complete-intake-continuation
  cancel-in-progress: false

jobs:
  repair:
    name: Prevent service classification from ending the interview
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install patch dependencies
        run: python -m pip install "PyYAML>=6.0,<7"

      - name: Apply deterministic intake continuation repair
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/repair_intake_continuation.py
          python /tmp/repair_intake_continuation.py
          rm -f /tmp/repair_intake_continuation.py

      - name: Verify generated syntax and configuration
        shell: bash
        run: |
          python -m py_compile             app/intake.py             app/business/service.py             app/ava/agents.py             tests/test_intake_continuation.py
          python - <<'PY_VERIFY'
          import yaml
          from pathlib import Path

          config = yaml.safe_load(
              Path("config/ava/ai-agent.local.yaml").read_text(
                  encoding="utf-8"
              )
          )
          tools = config["in_call_tools"]
          assert tools["floodman_classify_service"]["enabled"] is True
          assert "Non-terminal" in tools[
              "floodman_classify_service"
          ]["description"]
          assert "next_question" in tools[
              "floodman_capture_intake_progress"
          ]["description"]
          PY_VERIFY
          git diff --check

      - name: Install project test dependencies
        run: pip install -e '.[dev]'

      - name: Run continuation regression tests
        run: python -m pytest tests/test_intake_continuation.py -q

      - name: Run complete-intake tests
        run: python -m pytest tests/test_complete_intake_transcripts.py -q

      - name: Run full repository tests
        run: python -m pytest tests/ -x -q

      - name: Compile and validate repository
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          git diff --check

      - name: Commit tested continuation repair
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/intake.py             app/business/service.py             app/ava/agents.py             config/ava/ai-agent.local.yaml             tests/test_intake_continuation.py

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Complete-intake continuation repair is already installed."
          else
            git commit -m "fix: continue intake after service classification"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch full and lite container builds
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-container.yml --ref main

      - name: Summary
        run: |
          echo "### Complete intake continuation repair" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service classification is explicitly non-terminal" >> "$GITHUB_STEP_SUMMARY"
          echo "- Every classifier result includes an audible next question" >> "$GITHUB_STEP_SUMMARY"
          echo "- Every progress save returns the next missing question" >> "$GITHUB_STEP_SUMMARY"
          echo "- Details, safety, and timing are collected before contact fields" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full repository tests run before image publication" >> "$GITHUB_STEP_SUMMARY"
