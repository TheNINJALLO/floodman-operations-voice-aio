name: Repair Floodman GPU Appliance Llama Backends

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-gpu-appliance-llama-backends.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: repair-floodman-gpu-llama-backends
  cancel-in-progress: false

jobs:
  repair:
    name: Package CPU and CUDA backends beside llama-server
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out the appliance branch
        uses: actions/checkout@v4
        with:
          ref: self-hosted-gpu-appliance
          fetch-depth: 0

      - name: Set up test Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch llama backend discovery
        shell: bash
        run: |
          printf '%s' '' \
            | base64 -d > /tmp/patch_llama_backends.py
          python /tmp/patch_llama_backends.py
          rm -f /tmp/patch_llama_backends.py

      - name: Verify patched source
        working-directory: appliance
        shell: bash
        run: |
          python -m py_compile app/*.py scripts/*.py tests/*.py
          bash -n scripts/*.sh

          grep -q \
            'COPY --from=llama-build /out/lib/ /opt/llama/' \
            Dockerfile
          ! grep -q \
            'COPY --from=llama-build /out/lib/ /opt/llama/lib/' \
            Dockerfile
          grep -q \
            'LD_LIBRARY_PATH=/opt/llama:' \
            Dockerfile
          grep -q -- '--alias' scripts/llama-server.sh
          ! grep -q -- '--model-alias' scripts/llama-server.sh
          grep -q \
            'cd "${LLAMA_RUNTIME_DIR}"' \
            scripts/llama-server.sh

          git diff --check

      - name: Install appliance test dependencies
        working-directory: appliance
        run: pip install -e '.[dev]'

      - name: Run complete appliance tests
        working-directory: appliance
        env:
          PYTHONPATH: ${{ github.workspace }}/appliance
        run: python -m pytest tests -q

      - name: Commit tested backend repair
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            appliance/Dockerfile \
            appliance/pyproject.toml \
            appliance/scripts/llama-server.sh \
            appliance/tests/test_llama_backend_runtime_contract.py \
            appliance/FILE-MANIFEST.txt

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m \
              "fix: package llama CPU and CUDA backends beside the server"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push repaired appliance source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          git push origin HEAD:self-hosted-gpu-appliance

          REMOTE_SHA="$(
            git ls-remote origin \
              refs/heads/self-hosted-gpu-appliance |
            awk '{print $1}'
          )"
          test "${REMOTE_SHA}" = "${EXPECTED_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image names
        id: image
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          CANDIDATE="${IMAGE}:gpu-appliance-candidate-${SOURCE_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "candidate=${CANDIDATE}" >> "$GITHUB_OUTPUT"

      - name: Build exact tested image locally
        uses: docker/build-push-action@v6
        with:
          context: ./appliance
          file: ./appliance/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.candidate }}
          cache-from: type=gha,scope=gpu-appliance
          cache-to: type=gha,mode=max,scope=gpu-appliance
          provenance: false

      - name: Smoke-test packaged llama backends
        shell: bash
        env:
          CANDIDATE: ${{ steps.image.outputs.candidate }}
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            "${CANDIDATE}" \
            -lc '
              set -euo pipefail

              test -x /opt/llama/llama-server
              test -f /opt/llama/libggml-base.so
              test -f /opt/llama/libggml-cuda.so
              compgen -G "/opt/llama/libggml-cpu*.so" >/dev/null

              ldd /opt/llama/llama-server \
                | tee /tmp/llama-ldd.log
              if grep -q "not found" /tmp/llama-ldd.log; then
                echo "llama-server has unresolved shared libraries"
                exit 1
              fi

              cd /opt/llama
              /opt/llama/llama-server \
                --list-devices \
                > /tmp/llama-devices.log 2>&1
              cat /tmp/llama-devices.log

              if grep -q \
                "no backends are loaded" \
                /tmp/llama-devices.log; then
                echo "No llama backend was discovered"
                exit 1
              fi

              grep -Eqi \
                "cpu|available devices" \
                /tmp/llama-devices.log

              /opt/llama/llama-server --help \
                > /tmp/llama-help.log 2>&1
              grep -q -- "--alias" /tmp/llama-help.log
            '

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish repaired image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          CANDIDATE: ${{ steps.image.outputs.candidate }}
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          docker tag \
            "${CANDIDATE}" \
            "${IMAGE}:gpu-appliance"
          docker tag \
            "${CANDIDATE}" \
            "${IMAGE}:gpu-appliance-${SOURCE_SHA}"

          docker push "${IMAGE}:gpu-appliance"
          docker push \
            "${IMAGE}:gpu-appliance-${SOURCE_SHA}"

      - name: Upload Pterodactyl egg
        uses: actions/upload-artifact@v4
        with:
          name: floodman-gpu-appliance-llama-backend-egg
          path: appliance/pterodactyl/egg-floodman-voice-appliance.json
          if-no-files-found: error

      - name: Summary
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          echo "### Floodman llama backends repaired" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- CPU and CUDA backend plugins are beside llama-server" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Launcher uses --alias" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: ${SOURCE_SHA}" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Published: :gpu-appliance" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Published: :gpu-appliance-${SOURCE_SHA}" \
            >> "$GITHUB_STEP_SUMMARY"
