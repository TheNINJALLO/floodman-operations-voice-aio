name: Repair Floodman Runtime Engines

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-runtime-engines.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-runtime-engines-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair Asterisk, local AI, and writable caches
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write verified repair payload
        shell: python
        env:
          PATCHER_B64: ''
          TEST_B64: ''
        run: |
          import base64
          import os
          from pathlib import Path

          files = {
              "/tmp/apply_runtime_engines_fix.py": os.environ["PATCHER_B64"],
              "tests/test_runtime_engine_startup.py": os.environ["TEST_B64"],
          }
          for destination, encoded in files.items():
              path = Path(destination)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))

      - name: Apply deterministic runtime repair
        run: |
          python /tmp/apply_runtime_engines_fix.py
          chmod +x scripts/*.sh

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Validate focused runtime fixes
        run: python -m pytest tests/test_runtime_engine_startup.py -x -q

      - name: Run complete project validation
        run: |
          python -m pytest tests/ -x -q
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py

      - name: Commit tested runtime repair
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             scripts/entrypoint.sh             scripts/run_local_ai.sh             scripts/render_asterisk.py             tests/test_runtime_engine_startup.py
          if git diff --cached --quiet; then
            echo "No runtime repair changes were needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "fix: start Asterisk and local AI on Pterodactyl"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch container build from repaired main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ci-container.yml --ref main
          echo "Dispatched CI and Publish Floodman Containers on main."
