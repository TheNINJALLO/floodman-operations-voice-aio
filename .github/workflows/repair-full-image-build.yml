name: Repair Full Image Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-full-image-build.yml'

permissions:
  contents: write

concurrency:
  group: floodman-full-image-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Apply Piper and container build repair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write verified replacement files
        shell: python
        run: |
          import base64
          from pathlib import Path

          files = {
              'Dockerfile': '',
              'scripts/patch_ava.py': '',
              'tests/test_piper_compat_patch.py': '',
              'tests/test_container_build_contract.py': '',
              '.github/workflows/ci-container.yml': '',
              'THIRD_PARTY_NOTICES.md': '',
          }

          for relative_path, encoded in files.items():
              destination = Path(relative_path)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(base64.b64decode(encoded, validate=True))
              print(f"wrote {destination}")

      - name: Install test dependencies
        run: pip install -e '.[dev]'
      - name: Run full validation
        run: |
          python -m pytest tests/ -x -q
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
      - name: Verify repair contract
        run: |
          grep -q 'ARG PIPER_TTS_VERSION=1.6.0' Dockerfile
          ! grep -q 'piper-tts==1.2.0' Dockerfile
          grep -q 'Floodman Piper API compatibility patch' scripts/patch_ava.py
          grep -q 'publish-lite:' .github/workflows/ci-container.yml
          grep -q 'publish-full:' .github/workflows/ci-container.yml
      - name: Commit repaired build files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Dockerfile scripts/patch_ava.py tests/test_piper_compat_patch.py tests/test_container_build_contract.py .github/workflows/ci-container.yml THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then
            echo 'Repair files are already current.'
            exit 0
          fi
          git commit -m 'fix: update Piper and split container publishing'
          git push origin HEAD:main
