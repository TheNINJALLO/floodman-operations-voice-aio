name: Install Floodman Fast Intake and Team SMS v2

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/install-fast-intake-team-sms.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-fast-intake-team-sms-v2
  cancel-in-progress: false

jobs:
  install:
    name: Remove booking, reduce pauses, and route completed intake
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow patcher dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyYAML>=6.0,<7"
          python - <<'PY_DEPS'
          import yaml
          print(f"PyYAML ready: {yaml.__version__}")
          PY_DEPS

      - name: Install fast intake patcher
        shell: bash
        run: |
          printf '%s' '' | base64 -d > scripts/install_fast_intake_team_sms.py
          chmod +x scripts/install_fast_intake_team_sms.py
          python -m py_compile scripts/install_fast_intake_team_sms.py
          python - <<'PY_PREFLIGHT'
          import yaml
          from pathlib import Path

          installer = Path("scripts/install_fast_intake_team_sms.py")
          assert installer.is_file() and installer.stat().st_size > 1000
          print("Fast-intake installer dependency and payload preflight passed.")
          PY_PREFLIGHT
          python scripts/install_fast_intake_team_sms.py

      - name: Verify generated syntax
        shell: bash
        run: |
          python -m py_compile \
            app/notifications.py \
            app/config.py \
            app/business/service.py \
            app/outbound/worker.py \
            app/main.py \
            app/ava/agents.py \
            scripts/apply_production_hybrid_ai.py \
            scripts/install_fast_intake_team_sms.py \
            tests/test_fast_intake_team_sms.py
          git diff --check

      - name: Install project test dependencies
        run: pip install -e '.[dev]'

      - name: Run focused fast-intake tests
        run: python -m pytest tests/test_fast_intake_team_sms.py -q

      - name: Run complete repository tests
        run: python -m pytest tests/ -x -q

      - name: Compile and validate repository
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          git diff --check

      - name: Commit tested fast-intake system
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fast intake and team SMS routing are already installed."
          else
            git commit -m "feat: add fast no-booking intake and team SMS routing"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch full and lite container builds
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-container.yml --ref main

      - name: Summary
        run: |
          echo "### Floodman fast intake and team SMS v2" >> "$GITHUB_STEP_SUMMARY"
          echo "- Installs and verifies PyYAML before the generated patcher runs" >> "$GITHUB_STEP_SUMMARY"
          echo "- Uses caller ID instead of asking for the callback number when available" >> "$GITHUB_STEP_SUMMARY"
          echo "- Groups missing intake fields into one compact question" >> "$GITHUB_STEP_SUMMARY"
          echo "- Disables all automated inspection and estimate booking tools" >> "$GITHUB_STEP_SUMMARY"
          echo "- Saves intake locally before any external integration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Queues department-specific Twilio SMS alerts in the durable outbox" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tells normal callers the team will call within 24 hours" >> "$GITHUB_STEP_SUMMARY"
          echo "- Removes the obsolete invalid repair-cpu-audiosocket workflow" >> "$GITHUB_STEP_SUMMARY"
