name: Repair Floodman Groq Turn Latency

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-groq-turn-latency.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-groq-turn-latency
  cancel-in-progress: false

jobs:
  repair:
    name: Remove the post-answer stall and repair Groq failover
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Groq turn-recovery repair
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/install_groq_turn_latency_fix.py
          python /tmp/install_groq_turn_latency_fix.py
          rm -f /tmp/install_groq_turn_latency_fix.py

      - name: Verify generated syntax
        shell: bash
        run: |
          python -m py_compile \
            scripts/patch_ava_groq_turn_recovery.py \
            scripts/apply_production_hybrid_ai.py \
            tests/test_groq_turn_recovery.py
          git diff --check

      - name: Validate complete patch chain against pinned AVA
        shell: bash
        run: |
          rm -rf /tmp/floodman-ava-turn-recovery
          git init /tmp/floodman-ava-turn-recovery
          git -C /tmp/floodman-ava-turn-recovery remote add origin \
            https://github.com/hkjarral/AVA-AI-Voice-Agent-for-Asterisk.git
          git -C /tmp/floodman-ava-turn-recovery fetch --depth 1 origin \
            18d4e769335f3b643aca80e084c7e66f0969491e
          git -C /tmp/floodman-ava-turn-recovery checkout --detach FETCH_HEAD

          python scripts/patch_ava.py \
            --ava-root /tmp/floodman-ava-turn-recovery
          python scripts/patch_ava_optional_params.py \
            --ava-root /tmp/floodman-ava-turn-recovery
          python scripts/patch_ava_production.py \
            --ava-root /tmp/floodman-ava-turn-recovery
          python scripts/patch_ava_groq_resilience.py \
            --ava-root /tmp/floodman-ava-turn-recovery
          python scripts/patch_ava_groq_model_fallback.py \
            --ava-root /tmp/floodman-ava-turn-recovery
          python scripts/patch_ava_groq_turn_recovery.py \
            --ava-root /tmp/floodman-ava-turn-recovery
          python scripts/patch_ava_flux.py \
            --ava-root /tmp/floodman-ava-turn-recovery

          python -m py_compile \
            /tmp/floodman-ava-turn-recovery/src/pipelines/openai.py \
            /tmp/floodman-ava-turn-recovery/src/pipelines/deepgram_flux.py

          python - <<'PY_AVA'
          from pathlib import Path

          source = Path(
              "/tmp/floodman-ava-turn-recovery/src/pipelines/openai.py"
          ).read_text(encoding="utf-8")
          assert "Floodman Groq turn recovery patch" in source
          assert 'merged.get("chat_model")' in source
          assert '"chat_model"\n                            ] = fallback_model' in source
          assert "supports_reasoning_controls" in source
          assert "not is_groq_component" in source
          PY_AVA

      - name: Install project test dependencies
        run: pip install -e '.[dev]'

      - name: Run focused turn-recovery tests
        run: python -m pytest tests/test_groq_turn_recovery.py -q

      - name: Run full repository tests
        run: python -m pytest tests/ -x -q

      - name: Compile and validate repository
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          git diff --check

      - name: Commit tested turn-recovery repair
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Dockerfile \
            scripts/apply_production_hybrid_ai.py \
            scripts/patch_ava_groq_turn_recovery.py \
            tests/test_groq_turn_recovery.py \
            .env.twilio.example

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "fix: remove Groq turn stalls and repair fallback"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for GitHub main to expose the exact source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          for attempt in $(seq 1 40); do
            REMOTE_SHA="$(
              git ls-remote origin refs/heads/main |
              awk '{print $1}'
            )"
            if [[ "${REMOTE_SHA}" == "${EXPECTED_SHA}" ]]; then
              echo "GitHub main is at ${EXPECTED_SHA}"
              exit 0
            fi
            sleep 3
          done
          echo "GitHub main did not expose ${EXPECTED_SHA} in time."
          exit 1

      - name: Resolve or dispatch exact-SHA container build
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          SUCCESS_RUN_ID="$(
            gh run list \
              --workflow ci-container.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,headSha,status,conclusion |
            jq -r --arg sha "${EXPECTED_SHA}" '
              [
                .[]
                | select(
                    .headSha == $sha
                    and .status == "completed"
                    and .conclusion == "success"
                  )
              ]
              | sort_by(.databaseId)
              | last
              | .databaseId // empty
            '
          )"

          if [[ -n "${SUCCESS_RUN_ID}" ]]; then
            echo "run_id=${SUCCESS_RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci-container.yml --ref main

          for attempt in $(seq 1 40); do
            RUN_ID="$(
              gh run list \
                --workflow ci-container.yml \
                --branch main \
                --event workflow_dispatch \
                --limit 50 \
                --json databaseId,headSha,createdAt |
              jq -r \
                --arg sha "${EXPECTED_SHA}" \
                --arg dispatched "${DISPATCHED_AT}" '
                  [
                    .[]
                    | select(
                        .headSha == $sha
                        and .createdAt >= $dispatched
                      )
                  ]
                  | sort_by(.databaseId)
                  | last
                  | .databaseId // empty
                '
            )"
            if [[ -n "${RUN_ID}" ]]; then
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done

          echo "No newly dispatched container run targeted ${EXPECTED_SHA}."
          exit 1

      - name: Wait for full and lite images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          RUN_SHA="$(gh run view "${RUN_ID}" --json headSha --jq '.headSha')"
          if [[ "${RUN_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Run ${RUN_ID} targets ${RUN_SHA}, expected ${EXPECTED_SHA}."
            exit 1
          fi

          STATUS="$(gh run view "${RUN_ID}" --json status --jq '.status')"
          if [[ "${STATUS}" == "completed" ]]; then
            CONCLUSION="$(
              gh run view "${RUN_ID}" --json conclusion --jq '.conclusion'
            )"
            if [[ "${CONCLUSION}" != "success" ]]; then
              echo "Container run ${RUN_ID} completed with ${CONCLUSION}."
              exit 1
            fi
            exit 0
          fi

          gh run watch "${RUN_ID}" --exit-status --interval 10

      - name: Summary
        run: |
          echo "### Groq turn latency repaired" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reduces transcript aggregation from 2 seconds to 150 ms" >> "$GITHUB_STEP_SUMMARY"
          echo "- Honors Groq chat_model overrides instead of resetting them" >> "$GITHUB_STEP_SUMMARY"
          echo "- Switches Qwen to Llama immediately on HTTP 429" >> "$GITHUB_STEP_SUMMARY"
          echo "- Removes unsupported reasoning controls from Llama fallback" >> "$GITHUB_STEP_SUMMARY"
          echo "- Waits for the exact source SHA to publish full and lite images" >> "$GITHUB_STEP_SUMMARY"
