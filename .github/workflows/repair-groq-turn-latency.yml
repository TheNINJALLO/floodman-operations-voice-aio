name: Repair Floodman Groq Turn Latency

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-groq-turn-latency.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-groq-turn-latency
  cancel-in-progress: false

jobs:
  repair:
    name: Repair short-answer turns and Groq fallback
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the corrected Groq recovery patch
        shell: bash
        run: |
          cat > scripts/patch_ava_groq_model_fallback.py <<'PY_PATCH'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          from pathlib import Path


          MARKER = "Floodman Groq model fallback patch"
          TURN_MARKER = "Floodman Groq turn recovery patch"


          class PatchError(RuntimeError):
              pass


          def replace_once(
              text: str,
              old: str,
              new: str,
              label: str,
          ) -> str:
              count = text.count(old)
              if count != 1:
                  raise PatchError(
                      f"{label}: expected one source match, found {count}"
                  )
              return text.replace(old, new, 1)


          def patch_file(path: Path) -> bool:
              text = path.read_text(encoding="utf-8")
              has_model_patch = MARKER in text
              has_turn_patch = TURN_MARKER in text
              if has_model_patch and has_turn_patch:
                  return False
              if has_model_patch or has_turn_patch:
                  raise PatchError(
                      "partial Groq fallback patch state detected; "
                      "rebuild from the pinned clean AVA source"
                  )

              text = replace_once(
                  text,
                  '''            "rate_limit_max_wait_sec": float(
                          runtime_options.get(
                              "rate_limit_max_wait_sec",
                              self._pipeline_defaults.get("rate_limit_max_wait_sec", 10.0),
                          )
                      ),
                      "timeout_sec": float(runtime_options.get("timeout_sec", self._pipeline_defaults.get("timeout_sec", self._default_timeout))),
                  ''',
                  '''            "rate_limit_max_wait_sec": float(
                          runtime_options.get(
                              "rate_limit_max_wait_sec",
                              self._pipeline_defaults.get("rate_limit_max_wait_sec", 10.0),
                          )
                      ),
                      # Floodman Groq model fallback patch.
                      "rate_limit_fallback_model": str(
                          runtime_options.get(
                              "rate_limit_fallback_model",
                              self._pipeline_defaults.get(
                                  "rate_limit_fallback_model",
                                  "llama-3.3-70b-versatile",
                              ),
                          )
                          or ""
                      ).strip(),
                      "timeout_sec": float(runtime_options.get("timeout_sec", self._pipeline_defaults.get("timeout_sec", self._default_timeout))),
                  ''',
                  "Groq fallback option",
              )

              text = replace_once(
                  text,
                  '''        if _url_host(chat_base) == "api.groq.com" or chat_model.startswith("llama-") or "mixtral" in chat_model:
          ''',
                  '''        # Floodman Groq turn recovery patch.
                  is_groq_component = str(
                      self.component_key or ""
                  ).strip().lower().startswith("groq")
                  if (
                      not is_groq_component
                      and (
                          _url_host(chat_base) == "api.groq.com"
                          or chat_model.startswith("llama-")
                          or "mixtral" in chat_model
                      )
                  ):
          ''',
                  "Groq compatibility guard",
              )

              text = replace_once(
                  text,
                  '''        for optional_key in (
                      "top_p",
                      "presence_penalty",
                      "reasoning_effort",
                      "reasoning_format",
                      "service_tier",
                  ):
                      if merged.get(optional_key) is not None:
                          payload[optional_key] = merged[optional_key]
                  return payload''',
                  '''        for optional_key in (
                      "top_p",
                      "presence_penalty",
                      "reasoning_effort",
                      "reasoning_format",
                      "service_tier",
                  ):
                      value = merged.get(optional_key)
                      if value is None:
                          continue
                      if optional_key in {
                          "reasoning_effort",
                          "reasoning_format",
                      }:
                          model_name = str(
                              merged.get("chat_model") or ""
                          ).strip().lower()
                          supports_reasoning_controls = (
                              "qwen" in model_name
                              or "gpt-oss" in model_name
                          )
                          if not supports_reasoning_controls:
                              continue
                      payload[optional_key] = value
                  return payload''',
                  "model-aware reasoning payload",
              )

              text = replace_once(
                  text,
                  '''                        if response.status == 429 and attempt < retries:
                                      delay = _rate_limit_retry_delay(
                                          response,
                                          body,
                                          attempt,
                                          float(merged.get("rate_limit_max_wait_sec", 10.0)),
                                      )
                                      logger.warning(
                                          "Groq rate limit reached; waiting before serial retry",
                                          call_id=call_id,
                                          attempt=attempt + 1,
                                          max_attempts=retries + 1,
                                          delay_seconds=round(delay, 3),
                                      )
                                      await asyncio.sleep(delay)
                                      continue
                  ''',
                  '''                        if response.status == 429:
                                      fallback_model = str(
                                          merged.get("rate_limit_fallback_model") or ""
                                      ).strip()
                                      current_model = str(
                                          payload.get("model") or ""
                                      ).strip()
                                      if (
                                          fallback_model
                                          and current_model
                                          and fallback_model != current_model
                                      ):
                                          logger.warning(
                                              "Groq primary model rate limited; switching to fallback model",
                                              call_id=call_id,
                                              primary_model=current_model,
                                              fallback_model=fallback_model,
                                          )
                                          payload["model"] = fallback_model
                                          for incompatible_key in (
                                              "reasoning_effort",
                                              "reasoning_format",
                                          ):
                                              payload.pop(incompatible_key, None)
                                          continue
                                      if attempt < retries:
                                          delay = _rate_limit_retry_delay(
                                              response,
                                              body,
                                              attempt,
                                              float(
                                                  merged.get(
                                                      "rate_limit_max_wait_sec",
                                                      10.0,
                                                  )
                                              ),
                                          )
                                          logger.warning(
                                              "Groq rate limit reached; waiting before serial retry",
                                              call_id=call_id,
                                              attempt=attempt + 1,
                                              max_attempts=retries + 1,
                                              delay_seconds=round(delay, 3),
                                          )
                                          await asyncio.sleep(delay)
                                          continue
                  ''',
                  "serial Groq fallback",
              )

              text = replace_once(
                  text,
                  '''                    if response.status == 429:
                                  retry_attempt = int(
                                      (options or {}).get(
                                          "_floodman_rate_limit_attempt",
                                          0,
                                      )
                                  )
                  ''',
                  '''                    if response.status == 429:
                                  fallback_model = str(
                                      merged.get("rate_limit_fallback_model") or ""
                                  ).strip()
                                  current_model = str(
                                      merged.get("chat_model") or ""
                                  ).strip()
                                  fallback_used = bool(
                                      (options or {}).get(
                                          "_floodman_rate_limit_fallback_used",
                                          False,
                                      )
                                  )
                                  if (
                                      fallback_model
                                      and current_model
                                      and fallback_model != current_model
                                      and not fallback_used
                                  ):
                                      logger.warning(
                                          "Groq primary streaming model rate limited; switching to fallback model",
                                          call_id=call_id,
                                          primary_model=current_model,
                                          fallback_model=fallback_model,
                                      )
                                      response.release()
                                      retry_options = dict(options or {})
                                      retry_options["chat_model"] = fallback_model
                                      retry_options.pop("reasoning_effort", None)
                                      retry_options.pop("reasoning_format", None)
                                      retry_options[
                                          "_floodman_rate_limit_fallback_used"
                                      ] = True
                                      async for token in self.generate_stream(
                                          call_id,
                                          transcript,
                                          context,
                                          retry_options,
                                      ):
                                          yield token
                                      return
                                  retry_attempt = int(
                                      (options or {}).get(
                                          "_floodman_rate_limit_attempt",
                                          0,
                                      )
                                  )
                  ''',
                  "streaming Groq fallback",
              )

              compile(text, str(path), "exec")
              path.write_text(text, encoding="utf-8", newline="\n")
              return True


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument(
                  "--ava-root",
                  type=Path,
                  default=Path("/opt/ava"),
              )
              args = parser.parse_args()

              path = args.ava_root.resolve() / "src/pipelines/openai.py"
              if not path.is_file():
                  raise PatchError(f"required AVA source is missing: {path}")

              if patch_file(path):
                  print(f"patched {path}")
              else:
                  print("Groq model fallback and turn recovery already applied")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY_PATCH

          cat > tests/test_groq_turn_recovery.py <<'PY_TEST'
          from __future__ import annotations

          import base64
          import importlib.util
          import sys
          from pathlib import Path


          REPRESENTATIVE_SOURCE = base64.b64decode(
              ''
          ).decode("utf-8")


          def _load(name: str, path: Path):
              spec = importlib.util.spec_from_file_location(name, path)
              assert spec and spec.loader
              module = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = module
              spec.loader.exec_module(module)
              return module


          def test_groq_turn_recovery_patch_is_complete_and_idempotent(
              project_root: Path,
              tmp_path: Path,
          ) -> None:
              patcher = _load(
                  "groq_turn_recovery_test",
                  project_root / "scripts/patch_ava_groq_model_fallback.py",
              )
              target = tmp_path / "openai.py"
              target.write_text(REPRESENTATIVE_SOURCE, encoding="utf-8")

              assert patcher.patch_file(target) is True
              assert patcher.patch_file(target) is False

              result = target.read_text(encoding="utf-8")
              compile(result, str(target), "exec")
              assert "Floodman Groq model fallback patch" in result
              assert "Floodman Groq turn recovery patch" in result
              assert "not is_groq_component" in result
              assert 'merged.get("chat_model")' in result
              assert 'retry_options["chat_model"] = fallback_model' in result
              assert 'retry_options["model"] = fallback_model' not in result
              assert "supports_reasoning_controls" in result
              assert 'payload.pop(incompatible_key, None)' in result


          def test_production_pipeline_uses_fast_completed_turn_flush(
              project_root: Path,
          ) -> None:
              module = _load(
                  "turn_latency_profile_test",
                  project_root / "scripts/apply_production_hybrid_ai.py",
              )
              patch = module.production_patch()
              llm = patch["pipelines"]["floodman_production"]["options"]["llm"]
              assert llm["aggregation_timeout_sec"] == (
                  "${GROQ_AGGREGATION_TIMEOUT_SECONDS:-0.15}"
              )


          def test_existing_dockerfile_runs_the_upgraded_patch(
              project_root: Path,
          ) -> None:
              dockerfile = (project_root / "Dockerfile").read_text(
                  encoding="utf-8"
              )
              assert (
                  "COPY scripts/patch_ava_groq_model_fallback.py "
                  "/opt/floodman-build/patch_ava_groq_model_fallback.py"
                  in dockerfile
              )
              assert (
                  "python3 /opt/floodman-build/"
                  "patch_ava_groq_model_fallback.py --ava-root /opt/ava"
                  in dockerfile
              )
              assert (
                  'grep -q "Floodman Groq model fallback patch" '
                  "/opt/ava/src/pipelines/openai.py"
                  in dockerfile
              )
          PY_TEST

          python - <<'PY_CONFIG'
          from pathlib import Path

          path = Path("scripts/apply_production_hybrid_ai.py")
          text = path.read_text(encoding="utf-8")
          anchor = (
              '                        "rate_limit_fallback_model": '
              '"${GROQ_RATE_LIMIT_FALLBACK_MODEL:-llama-3.3-70b-versatile}",\n'
          )
          addition = (
              '                        "aggregation_timeout_sec": '
              '"${GROQ_AGGREGATION_TIMEOUT_SECONDS:-0.15}",\n'
          )
          if addition not in text:
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(
                      "production aggregation timeout anchor: "
                      f"expected one match, found {count}"
                  )
              text = text.replace(anchor, anchor + addition, 1)
          path.write_text(text, encoding="utf-8", newline="\n")

          example = Path(".env.twilio.example")
          if example.is_file():
              env_text = example.read_text(encoding="utf-8")
              marker = "GROQ_AGGREGATION_TIMEOUT_SECONDS="
              if marker not in env_text:
                  env_text = (
                      env_text.rstrip()
                      + "\n\n"
                      + "# Delay after a completed Deepgram Flux turn.\n"
                      + "GROQ_AGGREGATION_TIMEOUT_SECONDS=0.15\n"
                  )
                  example.write_text(
                      env_text,
                      encoding="utf-8",
                      newline="\n",
                  )
          PY_CONFIG

      - name: Verify generated source syntax
        shell: bash
        run: |
          python -m py_compile \
            scripts/patch_ava_groq_model_fallback.py \
            scripts/apply_production_hybrid_ai.py \
            tests/test_groq_turn_recovery.py
          git diff --check

      - name: Validate the complete patch chain against pinned AVA
        shell: bash
        run: |
          rm -rf /tmp/floodman-ava-turn-recovery
          git init /tmp/floodman-ava-turn-recovery
          git -C /tmp/floodman-ava-turn-recovery remote add origin \
            https://github.com/hkjarral/AVA-AI-Voice-Agent-for-Asterisk.git
          git -C /tmp/floodman-ava-turn-recovery fetch --depth 1 origin \
            18d4e769335f3b643aca80e084c7e66f0969491e
          git -C /tmp/floodman-ava-turn-recovery checkout --detach FETCH_HEAD

          python scripts/patch_ava.py \
            --ava-root /tmp/floodman-ava-turn-recovery
          python scripts/patch_ava_optional_params.py \
            --ava-root /tmp/floodman-ava-turn-recovery
          python scripts/patch_ava_production.py \
            --ava-root /tmp/floodman-ava-turn-recovery
          python scripts/patch_ava_groq_resilience.py \
            --ava-root /tmp/floodman-ava-turn-recovery
          python scripts/patch_ava_groq_model_fallback.py \
            --ava-root /tmp/floodman-ava-turn-recovery
          python scripts/patch_ava_groq_model_fallback.py \
            --ava-root /tmp/floodman-ava-turn-recovery
          python scripts/patch_ava_flux.py \
            --ava-root /tmp/floodman-ava-turn-recovery

          python -m py_compile \
            /tmp/floodman-ava-turn-recovery/src/pipelines/openai.py \
            /tmp/floodman-ava-turn-recovery/src/pipelines/deepgram_flux.py

          python - <<'PY_AVA'
          from pathlib import Path

          source = Path(
              "/tmp/floodman-ava-turn-recovery/src/pipelines/openai.py"
          ).read_text(encoding="utf-8")

          required = (
              "Floodman Groq model fallback patch",
              "Floodman Groq turn recovery patch",
              "not is_groq_component",
              'merged.get("chat_model")',
              'retry_options["chat_model"] = fallback_model',
              "supports_reasoning_controls",
              "payload.pop(incompatible_key, None)",
          )
          for marker in required:
              assert marker in source, marker

          assert 'retry_options["model"] = fallback_model' not in source
          assert (
              'if _url_host(chat_base) == "api.groq.com" '
              'or chat_model.startswith("llama-")'
          ) not in source
          PY_AVA

      - name: Install project test dependencies
        run: pip install -e '.[dev]'

      - name: Run focused Groq recovery tests
        run: python -m pytest tests/test_groq_turn_recovery.py -q

      - name: Run full repository tests
        run: python -m pytest tests/ -x -q

      - name: Compile and validate the repository
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          git diff --check

      - name: Commit the tested repair
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/patch_ava_groq_model_fallback.py \
            scripts/apply_production_hybrid_ai.py \
            tests/test_groq_turn_recovery.py

          if [[ -f .env.twilio.example ]]; then
            git add .env.twilio.example
          fi

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "fix: repair Groq turn recovery and short-answer latency"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for GitHub main to expose the exact commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          for attempt in $(seq 1 40); do
            REMOTE_SHA="$(
              git ls-remote origin refs/heads/main |
              awk '{print $1}'
            )"
            if [[ "${REMOTE_SHA}" == "${EXPECTED_SHA}" ]]; then
              echo "GitHub main is at ${EXPECTED_SHA}"
              exit 0
            fi
            sleep 3
          done
          echo "GitHub main did not expose ${EXPECTED_SHA} in time."
          exit 1

      - name: Resolve or dispatch the exact-SHA container build
        id: container
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          find_run() {
            gh run list \
              --workflow ci-container.yml \
              --branch main \
              --limit 100 \
              --json databaseId,headSha,createdAt,status,conclusion,event |
            jq -r --arg sha "${EXPECTED_SHA}" '
              [
                .[]
                | select(.headSha == $sha)
              ]
              | sort_by(.databaseId)
              | last
              | .databaseId // empty
            '
          }

          RUN_ID=""
          for attempt in $(seq 1 24); do
            RUN_ID="$(find_run)"
            if [[ -n "${RUN_ID}" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "${RUN_ID}" ]]; then
            DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run ci-container.yml --ref main

            for attempt in $(seq 1 40); do
              RUN_ID="$(
                gh run list \
                  --workflow ci-container.yml \
                  --branch main \
                  --event workflow_dispatch \
                  --limit 100 \
                  --json databaseId,headSha,createdAt |
                jq -r \
                  --arg sha "${EXPECTED_SHA}" \
                  --arg dispatched "${DISPATCHED_AT}" '
                    [
                      .[]
                      | select(
                          .headSha == $sha
                          and .createdAt >= $dispatched
                        )
                    ]
                    | sort_by(.databaseId)
                    | last
                    | .databaseId // empty
                  '
              )"
              if [[ -n "${RUN_ID}" ]]; then
                break
              fi
              sleep 3
            done
          fi

          if [[ -z "${RUN_ID}" ]]; then
            echo "No container build targeted ${EXPECTED_SHA}."
            exit 1
          fi

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for the full and lite images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.container.outputs.run_id }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          RUN_SHA="$(gh run view "${RUN_ID}" --json headSha --jq '.headSha')"
          if [[ "${RUN_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Run ${RUN_ID} targets ${RUN_SHA}, expected ${EXPECTED_SHA}."
            exit 1
          fi

          STATUS="$(gh run view "${RUN_ID}" --json status --jq '.status')"
          if [[ "${STATUS}" == "completed" ]]; then
            CONCLUSION="$(
              gh run view "${RUN_ID}" --json conclusion --jq '.conclusion'
            )"
            if [[ "${CONCLUSION}" != "success" ]]; then
              echo "Container run ${RUN_ID} completed with ${CONCLUSION}."
              exit 1
            fi
          else
            gh run watch "${RUN_ID}" --exit-status --interval 10
          fi

      - name: Summary
        run: |
          echo "### Groq turn recovery repaired" >> "$GITHUB_STEP_SUMMARY"
          echo "- No Dockerfile rewrite is required" >> "$GITHUB_STEP_SUMMARY"
          echo "- Short completed turns flush after 150 ms" >> "$GITHUB_STEP_SUMMARY"
          echo "- Streaming 429 responses switch immediately to Llama" >> "$GITHUB_STEP_SUMMARY"
          echo "- Llama never receives Qwen-only reasoning controls" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full and lite images are tied to the exact tested SHA" >> "$GITHUB_STEP_SUMMARY"
