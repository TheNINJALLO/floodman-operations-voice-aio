name: Build optional local call learning
"on":
  push:
    branches: [codex/local-learning-20261110]
    paths: ["appliance/**", ".github/workflows/build-local-learning.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appliance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: appliance/pyproject.toml
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: python -m py_compile app/learning*.py app/main.py
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build learning on the verified speech image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./appliance
          file: ./appliance/Dockerfile.learning
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:cpu-learning-${{ github.sha }}
      - name: Verify the inherited Asterisk handoff without a carrier
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /home/container/data:rw,uid=988,gid=988
          -e LOCAL_VOICE_STACK=standard --entrypoint /opt/venv/bin/python
          '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}'
          /opt/floodman/scripts/smoke_transfer_handoff.py
      - name: Record immutable image
        run: echo '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
