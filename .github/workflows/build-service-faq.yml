name: Build prepared service answers
"on":
  push:
    branches: [codex/service-faq-20261112]
    paths: ["appliance/**", ".github/workflows/build-service-faq.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appliance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: appliance/pyproject.toml
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q --junitxml=service-faq-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-faq-tests
          path: appliance/service-faq-tests.xml
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build prepared answers on verified voice image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./appliance
          file: ./appliance/Dockerfile.faq
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:cpu-faq-${{ github.sha }}
      - name: Check all prepared sources in the actual image
        run: >-
          docker run --rm --network none --read-only --entrypoint /opt/venv/bin/python
          '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}'
          -c "from pathlib import Path; from app.knowledge import KnowledgeBase; b=KnowledgeBase(Path('/opt/floodman/knowledge')).prepared_answers; assert len(b.entries)==36 and b.invalid_entries==0; assert b.match('How does mold remediation work').id=='mold-process'"
      - name: Verify inherited Asterisk handoff without a carrier
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /home/container/data:rw,uid=988,gid=988
          -e LOCAL_VOICE_STACK=standard --entrypoint /opt/venv/bin/python
          '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}'
          /opt/floodman/scripts/smoke_transfer_handoff.py
      - name: Record immutable image
        run: echo '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
