name: Build isolated same-host model comparison runner

"on":
  push:
    branches: [codex/ryzen-model-comparison]
    paths: ["appliance/Dockerfile.model-comparison", ".github/workflows/model-comparison-runner.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Publish startup-only comparison image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./appliance
          file: ./appliance/Dockerfile.model-comparison
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:model-comparison-${{ github.sha }}
      - name: Record immutable image
        run: echo '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
