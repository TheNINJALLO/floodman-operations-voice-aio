name: Repair Floodman Runtime Profile and Quiet Console

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-runtime-profile-quiet-console.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-runtime-profile-quiet-console
  cancel-in-progress: false

jobs:
  repair:
    name: Prove the selected AI profile and quiet Asterisk startup
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply runtime-profile and quiet-console repair
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/install_runtime_profile_quiet_console.py
          python /tmp/install_runtime_profile_quiet_console.py
          rm -f /tmp/install_runtime_profile_quiet_console.py

      - name: Verify generated source
        shell: bash
        run: |
          python -m py_compile \
            scripts/patch_runtime_profile_quiet_console.py \
            tests/test_runtime_profile_quiet_console.py

          bash -n \
            scripts/select_ai_profile.sh \
            scripts/run_local_ai.sh \
            scripts/run_asterisk.sh

          grep -q \
            "Floodman persistent AI profile status" \
            scripts/select_ai_profile.sh
          grep -q \
            "Floodman production profile local-model guard" \
            scripts/run_local_ai.sh
          grep -q \
            "Floodman configurable Asterisk startup verbosity" \
            scripts/run_asterisk.sh

          git diff --check

      - name: Install project test dependencies
        run: pip install -e '.[dev]'

      - name: Run focused runtime-profile tests
        run: |
          python -m pytest \
            tests/test_runtime_profile_quiet_console.py \
            tests/test_production_profile_lock.py \
            tests/test_ai_profile_fallback_recovery.py \
            tests/test_profile_pipeline_pruning.py \
            tests/test_cloud_safe_console.py \
            tests/test_runtime_engine_startup.py \
            -q

      - name: Run complete repository tests
        run: python -m pytest tests/ -q

      - name: Compile and validate repository
        shell: bash
        run: |
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py
          git diff --check

      - name: Commit tested runtime repair
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/select_ai_profile.sh \
            scripts/run_local_ai.sh \
            scripts/run_asterisk.sh \
            scripts/patch_runtime_profile_quiet_console.py \
            tests/test_runtime_profile_quiet_console.py \
            .env.twilio.example

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m \
              "fix: expose runtime AI profile and quiet Asterisk startup"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for main to expose the exact source SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          for attempt in $(seq 1 40); do
            REMOTE_SHA="$(
              git ls-remote origin refs/heads/main |
              awk '{print $1}'
            )"
            if [[ "${REMOTE_SHA}" == "${EXPECTED_SHA}" ]]; then
              echo "GitHub main is at ${EXPECTED_SHA}"
              exit 0
            fi
            sleep 3
          done
          echo "GitHub main did not expose ${EXPECTED_SHA} in time."
          exit 1

      - name: Resolve or dispatch exact-SHA container build
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          SUCCESS_RUN_ID="$(
            gh run list \
              --workflow ci-container.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,headSha,status,conclusion |
            jq -r --arg sha "${EXPECTED_SHA}" '
              [
                .[]
                | select(
                    .headSha == $sha
                    and .status == "completed"
                    and .conclusion == "success"
                  )
              ]
              | sort_by(.databaseId)
              | last
              | .databaseId // empty
            '
          )"

          if [[ -n "${SUCCESS_RUN_ID}" ]]; then
            echo "run_id=${SUCCESS_RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci-container.yml --ref main

          for attempt in $(seq 1 40); do
            RUN_ID="$(
              gh run list \
                --workflow ci-container.yml \
                --branch main \
                --event workflow_dispatch \
                --limit 50 \
                --json databaseId,headSha,createdAt |
              jq -r \
                --arg sha "${EXPECTED_SHA}" \
                --arg dispatched "${DISPATCHED_AT}" '
                  [
                    .[]
                    | select(
                        .headSha == $sha
                        and .createdAt >= $dispatched
                      )
                  ]
                  | sort_by(.databaseId)
                  | last
                  | .databaseId // empty
                '
            )"
            if [[ -n "${RUN_ID}" ]]; then
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done

          echo "No newly dispatched container build targeted ${EXPECTED_SHA}."
          exit 1

      - name: Wait for full and lite images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          RUN_SHA="$(gh run view "${RUN_ID}" --json headSha --jq '.headSha')"
          if [[ "${RUN_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Run ${RUN_ID} targets ${RUN_SHA}; expected ${EXPECTED_SHA}."
            exit 1
          fi

          STATUS="$(gh run view "${RUN_ID}" --json status --jq '.status')"
          if [[ "${STATUS}" == "completed" ]]; then
            CONCLUSION="$(
              gh run view "${RUN_ID}" --json conclusion --jq '.conclusion'
            )"
            if [[ "${CONCLUSION}" != "success" ]]; then
              echo "Container run ${RUN_ID} completed with ${CONCLUSION}."
              exit 1
            fi
            exit 0
          fi

          gh run watch "${RUN_ID}" --exit-status --interval 10

      - name: Summary
        run: |
          echo "### Floodman runtime profile and quiet console" >> "$GITHUB_STEP_SUMMARY"
          echo "- Writes the requested and selected profile to data/runtime/ai-profile-status.env" >> "$GITHUB_STEP_SUMMARY"
          echo "- Explicit production cannot load Vosk, local Qwen, or Piper" >> "$GITHUB_STEP_SUMMARY"
          echo "- Removes hard-coded Asterisk -vvv startup verbosity" >> "$GITHUB_STEP_SUMMARY"
          echo "- Keeps verbosity 1-3 available as an opt-in diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publishes full and lite images from the exact tested SHA" >> "$GITHUB_STEP_SUMMARY"
