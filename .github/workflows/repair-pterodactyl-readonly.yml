name: Repair Pterodactyl Read-Only Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-pterodactyl-readonly.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: floodman-pterodactyl-readonly-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Move AVA runtime to writable storage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write repair payload
        shell: python
        env:
          PREPARE_AVA_B64: 
          TEST_B64: 
          PATCHER_B64: 
        run: |
          import base64
          import os
          from pathlib import Path

          files = {
              "scripts/prepare_ava_runtime.sh": os.environ["PREPARE_AVA_B64"],
              "tests/test_pterodactyl_readonly_runtime.py": os.environ["TEST_B64"],
              "/tmp/apply_pterodactyl_runtime_fix.py": os.environ["PATCHER_B64"],
          }
          for relative, encoded in files.items():
              destination = Path(relative)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(base64.b64decode(encoded))

      - name: Patch startup paths
        run: python /tmp/apply_pterodactyl_runtime_fix.py

      - name: Restore executable permissions
        run: |
          chmod +x scripts/prepare_ava_runtime.sh
          chmod +x scripts/entrypoint.sh
          chmod +x scripts/run_ava.sh
          chmod +x scripts/run_local_ai.sh

      - name: Install validation dependencies
        run: pip install -e '.[dev]'

      - name: Run focused Pterodactyl runtime tests
        run: python -m pytest tests/test_pterodactyl_readonly_runtime.py -q

      - name: Run complete project validation
        run: |
          python -m pytest tests/ -x -q
          python -m compileall app scripts tests
          bash -n scripts/*.sh
          python scripts/validate_configs.py

      - name: Commit tested runtime repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             scripts/prepare_ava_runtime.sh             scripts/entrypoint.sh             scripts/run_ava.sh             scripts/run_local_ai.sh             supervisord.conf             tests/test_pterodactyl_readonly_runtime.py
          if git diff --cached --quiet; then
            echo "Pterodactyl runtime repair is already present."
          else
            git commit -m "fix: run AVA from writable Pterodactyl runtime"
            git push origin main
          fi

      - name: Launch corrected container build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/ci-container.yml/dispatches"             -f ref=main
