business:
  legal_name: Floodman LLC
  public_name: Floodman
  website: https://floodman.com
  primary_phone: 231-935-4921
  emergency_availability: 24/7 emergency call intake and water-damage response
  human_disclosure: I am Floodman's automated assistant.
  public_profile:
    summary: Floodman provides property water, moisture, foundation, crawl-space, mold, and related restoration
      services across published communities in Northern and West Michigan.
    experience_claim: Floodman's public website states that the company has served Traverse City and Northern
      Michigan for over 50 years.
    free_inspection: true
    free_consultation: true
    source_reviewed_at: '2026-08-12'
    source_urls:
    - https://floodman.com/
    - https://floodman.com/blog
    source_policy: Use the homepage for company promises. Use approved knowledge documents for educational
      explanations. Do not turn testimonials, blog examples, or marketing adjectives into guarantees.
  services:
    water_damage_restoration:
      public_name: 24/7 water damage restoration
      website_advertises: true
      summary: Emergency response for burst pipes, failed water heaters, sump-pump failures, flooded basements,
        leaks, and other water intrusion.
      website_described_process:
      - Dispatch and on-site assessment
      - Moisture mapping with thermal imaging cameras and moisture meters
      - Standing-water extraction and an inspection-specific structural drying plan
      - Industrial air movement and dehumidification
      - Sanitization or antimicrobial treatment when appropriate for the loss
      website_public_claims:
      - The website describes the rapid-response team as IICRC-certified.
      - The website states that drying decisions use psychrometry and IICRC standards.
      - The website advertises thermal imaging, moisture meters, extraction equipment, industrial air
        movers, dehumidification, and EPA-approved antimicrobial products.
      intake_questions:
      - Is water actively entering or rising?
      - Has the source been stopped?
      - Is sewage or contaminated water involved?
      - Is standing water near electricity, appliances, or the electrical panel?
      - Which rooms and materials are affected?
      - When did the loss begin?
      - Is the property safe to enter?
      no_phone_promises:
      - Do not guarantee an arrival time.
      - Do not classify the water category or confirm hidden damage without inspection.
      - Do not promise that every material can be saved.
      - Do not guarantee insurance coverage or direct billing.
    mold_remediation:
      public_name: Certified mold remediation
      website_advertises: true
      summary: Containment-focused mold remediation that addresses contaminated material and the moisture
        condition contributing to growth.
      website_described_process:
      - Establish containment barriers
      - Use negative air pressure to reduce cross-contamination
      - Remove contaminated materials as required by the inspected condition
      - HEPA-vacuum the affected area
      - Treat underlying structural surfaces when appropriate
      - Identify and address the moisture source
      - Provide documentation for property or insurance records when applicable
      common_customer_signs:
      - Visible growth or spotting
      - Persistent musty odor
      - Past or current moisture
      - Growth in a basement, crawl space, wall cavity, or other damp area
      no_phone_promises:
      - Do not identify a substance as mold from a voice description or photograph alone.
      - Do not provide medical advice or guarantee a health outcome.
      - Do not promise that mold will never return; explain that controlling moisture is essential.
    foundation_repair:
      public_name: Foundation repair
      website_advertises: true
      summary: Inspection-led solutions for foundation cracks, bowing or leaning walls, settlement, and
        related structural concerns.
      common_customer_signs:
      - Cracks in foundation walls or floors
      - Bowing or bulging basement walls
      - Uneven or sloping floors
      - Doors or windows that stick
      - Visible settlement or movement
      - Water entering through a crack
      possible_methods_not_guaranteed:
      - Crack repair
      - Wall stabilization
      - Carbon-fiber reinforcement when appropriate
      - Other engineered or inspection-specific structural work
      no_phone_promises:
      - Do not diagnose structural safety by phone.
      - Do not promise a specific repair method before inspection.
      - Do not repeat the website phrase 'permanent solution' as a warranty or guarantee.
      - Escalate suspected immediate collapse or life-safety risks to emergency services and a human.
    basement_waterproofing:
      public_name: Basement waterproofing and moisture management
      website_advertises: true
      summary: Inspection-specific systems intended to control basement water entry, seepage, drainage,
        humidity, and related moisture conditions.
      common_customer_signs:
      - Water after heavy rain
      - Wall or floor seepage
      - Wet cracks
      - Standing water
      - Damp walls or floors
      - Efflorescence
      - Musty odor
      - Repeated sump-pump activity
      possible_components_not_guaranteed:
      - Drainage improvements
      - Sump-pump solutions
      - Crack repair
      - Moisture control
      - Vapor or waterproofing barriers
      - Exterior or interior measures selected after inspection
      no_phone_promises:
      - Do not tell a caller they need a complete system based only on symptoms.
      - Do not quote a fixed price or exact scope by phone.
      - Do not guarantee a basement will remain dry without reviewing the proposed agreement.
    crawl_space_encapsulation:
      public_name: Crawl-space encapsulation and moisture control
      website_advertises: true
      summary: Moisture-control work for crawl spaces, with the final scope based on inspection of water
        entry, soil moisture, humidity, insulation, drainage, mold, and structural conditions.
      common_customer_signs:
      - Musty odor
      - High humidity
      - Condensation
      - Wet soil or standing water
      - Deteriorated insulation
      - Visible growth
      - Cold or uneven floors
      - Pest or air-quality concerns
      educational_components:
      - A durable vapor barrier may cover the floor and extend to walls as appropriate.
      - Sealing, drainage, dehumidification, insulation, and remediation needs are determined after inspection.
      benefits_described_on_website:
      - Moisture control
      - Mold prevention
      - Improved energy efficiency
      - Support for healthier indoor air and structural durability
      no_phone_promises:
      - Do not prescribe a barrier thickness, dehumidifier, insulation package, or drainage scope without
        inspection.
      - Do not promise energy savings or indoor-air improvements as a quantified result.
    sump_pump_and_drainage:
      public_name: Sump-pump and drainage services
      website_advertises: true
      summary: Inspection, response, and property-specific solutions for sump-pump failures, drainage
        concerns, and water movement around or beneath a structure.
      common_customer_signs:
      - Sump pump not running
      - Pump running constantly
      - Alarm sounding
      - Pit overflowing
      - Water after rain
      - Poor discharge flow
      - Pooling near the foundation
      - Repeated basement or crawl-space water
      emergency_policy: A failed sump pump with active or rising water is treated as an urgent water-damage
        intake.
      no_phone_promises:
      - Do not guarantee arrival within an hour. The public website advertises rapid response, but actual
        timing depends on location, crew availability, weather, roads, and emergency volume.
      - Do not diagnose the pump, check valve, discharge line, electrical supply, or drainage system without
        inspection.
  inspection_policy:
    free_inspection_advertised: true
    free_consultation_advertised: true
    inspection_required_for_final_recommendation: true
    phone_estimates: false
    approved_response: Floodman's website advertises free inspections and consultations. Final recommendations,
