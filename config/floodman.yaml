  pricing_policy:
    provide_exact_price_by_phone: false
    provide_unapproved_ranges: false
    approved_response: Pricing depends on the source and extent of the problem, affected materials, access,
      required drying or repair, and the inspection findings. The assistant can help arrange a free inspection
      or a human callback.
