[supervisord]
nodaemon=true
logfile=%(ENV_SUPERVISOR_LOGFILE)s
pidfile=%(ENV_SUPERVISOR_PIDFILE)s
childlogdir=%(ENV_SUPERVISOR_CHILDLOGDIR)s

[program:asterisk]
command=/opt/floodman/scripts/run_asterisk.sh
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:floodman-control]
command=/opt/floodman/scripts/run_control.sh
directory=/opt/floodman
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:local-ai]
command=/opt/floodman/scripts/run_local_ai.sh
directory=%(ENV_AVA_RUNTIME_DIR)s
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:ava]
command=/opt/floodman/scripts/run_ava.sh
directory=%(ENV_AVA_RUNTIME_DIR)s
priority=40
autostart=true
autorestart=true
startsecs=5
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
